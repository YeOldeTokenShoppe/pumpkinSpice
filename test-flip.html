<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip Test</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #333;
            margin: 0;
        }
        
        .container {
            perspective: 800px;
        }
        
        .card {
            width: 300px;
            height: 420px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }
        
        .card.flipped {
            transform: rotateY(180deg);
        }
        
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }
        
        .card-front {
            background: white;
            color: black;
        }
        
        .card-back {
            background: purple;
            color: white;
            transform: rotateY(180deg);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" id="card">
            <div class="card-face card-front">FRONT</div>
            <div class="card-face card-back">BACK</div>
        </div>
    </div>
    
    <script>
        const card = document.getElementById('card');
        let isFlipped = false;
        
        card.addEventListener('click', () => {
            isFlipped = !isFlipped;
            console.log('Flipped:', isFlipped);
            if (isFlipped) {
                card.classList.add('flipped');
            } else {
                card.classList.remove('flipped');
            }
        });
    </script>
</body>
</html>

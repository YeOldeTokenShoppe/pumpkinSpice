<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moon Room</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Lato&display=swap");
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        overscroll-behavior-x: none;
        overscroll-behavior-y: none;
        scroll-behavior: smooth;
      }
      body {
        font-family: "Lato", sans-serif;
        position: relative;
        width: 100%;
        max-width: 100vw;
        height: auto;
        min-height: 100vh;
        text-align: center;
        overflow-x: hidden;

        background: #1b1724;
        color: #1b1724;
      }

      /* Chat Interface Styles */
      .chat-container {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 440px;
        height: 500px;
        background: rgba(26, 26, 58, 0.95);
        border: 2px solid rgba(250, 240, 230, 0.2);
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        z-index: 1000;
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        transition: all 0.3s ease;
      }

      .chat-container.minimized {
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
      }
      
      .chat-container.minimized.new-message {
        animation: pulse 1s infinite !important;
        background: rgba(255, 100, 100, 0.95) !important;
        border: 2px solid rgba(255, 200, 200, 0.8) !important;
        box-shadow: 0 0 20px rgba(255, 100, 100, 0.8) !important;
      }
      
      @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
      }

      .chat-header {
        padding: 12px 16px;
        background: rgba(26, 26, 58, 0.8);
        border-bottom: 1px solid rgba(250, 240, 230, 0.1);
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-radius: 12px 12px 0 0;
      }

      .chat-title {
        color: #ff4080;
        font-weight: bold;
        font-size: 16px;
      }

      .toggle-btn {
        background: none;
        border: none;
        color: #ff4080;
        font-size: 20px;
        cursor: pointer;
        padding: 0 8px;
        transition: transform 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 32px;
        min-height: 32px;
      }

      .toggle-btn:hover {
        transform: scale(1.1);
      }

      .chat-content {
        flex: 1;
        display: flex;
        overflow: hidden;
      }

      .chat-container.minimized .chat-content {
        display: none;
      }

      .online-members {
        width: 120px;
        background: rgba(26, 26, 58, 0.5);
        border-right: 1px solid rgba(250, 240, 230, 0.1);
        padding: 10px;
      }

      .members-header {
        color: #ff4080;
        font-size: 12px;
        font-weight: bold;
        margin-bottom: 10px;
        text-align: left;
      }

      .members-list {
        color: #ff4080;
        font-size: 11px;
      }

      .member-item {
        padding: 4px 0;
        text-align: left;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .member-item.online {
        color: #4ade80;
      }
      
      .member-avatar {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 1px solid rgba(255, 215, 0, 0.3);
        object-fit: cover;
        flex-shrink: 0;
      }
      
      .member-avatar.default {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #ff0040 0%, #0064ff 100%);
        color: white;
        font-size: 11px;
        font-weight: bold;
      }
      
      .member-name {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .chat-main {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .messages-container {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .message {
        background: rgba(250, 240, 230, 0.05);
        border-radius: 8px;
        padding: 8px 12px;
        color: #ff4080;
        text-align: left;
        animation: fadeIn 0.3s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message-author {
        font-size: 11px;
        color: #0064ff;
        margin-bottom: 4px;
        font-weight: bold;
      }

      .message-text {
        font-size: 13px;
        word-wrap: break-word;
      }

      .message-time {
        font-size: 10px;
        color: rgba(250, 240, 230, 0.4);
        margin-top: 4px;
      }

      .chat-input-container {
        padding: 10px;
        border-top: 1px solid rgba(250, 240, 230, 0.1);
        display: flex;
        gap: 8px;
      }

      .message-input {
        flex: 1;
        background: rgba(250, 240, 230, 0.05);
        border: 1px solid rgba(250, 240, 230, 0.2);
        border-radius: 6px;
        padding: 8px 12px;
        color: #ff4080;
        font-size: 13px;
        outline: none;
      }

      .message-input:focus {
        border-color: rgba(250, 240, 230, 0.4);
        background: rgba(250, 240, 230, 0.08);
      }

      .message-input::placeholder {
        color: rgba(250, 240, 230, 0.3);
      }

      .send-button {
        background: linear-gradient(135deg, #ff0040 0%, #0064ff 100%);
        border: none;
        border-radius: 6px;
        padding: 8px 16px;
        color: #ff4080;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s;
      }

      .send-button:hover {
        transform: scale(1.05);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      }

      .send-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* Emoji Picker Styles */
      .emoji-button {
        background: rgba(250, 240, 230, 0.1);
        border: 1px solid rgba(250, 240, 230, 0.2);
        border-radius: 6px;
        padding: 8px;
        color: #ff4080;
        font-size: 18px;
        cursor: pointer;
        transition: all 0.3s;
        margin-right: 8px;
      }

      .emoji-button:hover {
        background: rgba(250, 240, 230, 0.2);
        transform: scale(1.1);
      }

      .emoji-picker {
        position: absolute;
        bottom: 60px;
        left: 10px;
        right: 10px;
        background: rgba(26, 26, 58, 0.98);
        border: 1px solid rgba(250, 240, 230, 0.2);
        border-radius: 8px;
        padding: 10px;
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 5px;
        max-height: 200px;
        overflow-y: auto;
        backdrop-filter: blur(10px);
        z-index: 10;
      }

      .emoji-item {
        background: rgba(250, 240, 230, 0.05);
        border: 1px solid transparent;
        border-radius: 4px;
        padding: 8px;
        font-size: 20px;
        cursor: pointer;
        text-align: center;
        transition: all 0.2s;
      }

      .emoji-item:hover {
        background: rgba(250, 240, 230, 0.2);
        border-color: rgba(250, 240, 230, 0.3);
        transform: scale(1.2);
      }

      .emoji-category {
        grid-column: span 8;
        color: #0064ff;
        font-size: 11px;
        font-weight: bold;
        margin: 5px 0;
        padding: 5px;
        border-bottom: 1px solid rgba(250, 240, 230, 0.1);
      }

      /* Scrollbar Styles */
      .messages-container::-webkit-scrollbar {
        width: 6px;
      }

      .messages-container::-webkit-scrollbar-track {
        background: rgba(250, 240, 230, 0.05);
      }

      .messages-container::-webkit-scrollbar-thumb {
        background: rgba(250, 240, 230, 0.2);
        border-radius: 3px;
      }

      .messages-container::-webkit-scrollbar-thumb:hover {
        background: rgba(250, 240, 230, 0.3);
      }

      /* Mobile Responsive */
      @media (max-width: 768px) {
        .chat-container {
          width: calc(100vw - 20px);
          height: 50vh;
          max-height: 400px;
          right: 10px;
          bottom: 10px;
          left: 10px;
          border-radius: 12px;
          border: 2px solid rgba(250, 240, 230, 0.3);
          font-size: 16px; /* Prevent zoom on iOS */
          box-shadow: 0 -2px 20px rgba(0, 0, 0, 0.3);
        }
        
        .chat-container.minimized {
          height: 50px;
          width: auto;
          min-width: 120px;
          right: 10px;
          bottom: 10px;
          left: auto;
          border-radius: 25px;
          background: rgba(102, 126, 234, 0.95);
          border: 2px solid rgba(250, 240, 230, 0.4);
          padding: 0 15px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        
        .chat-container.minimized.new-message {
          animation: pulse 1s infinite !important;
          background: rgba(255, 100, 100, 0.95) !important;
          border: 2px solid rgba(255, 200, 200, 0.8) !important;
          box-shadow: 0 0 20px rgba(255, 100, 100, 0.8) !important;
        }
        
        .chat-container.minimized .chat-header {
          border: none;
          background: transparent;
          justify-content: center;
          align-items: center;
          padding: 0;
          display: flex;
        }
        
        .chat-container.minimized .members-toggle-btn {
          display: none !important;
        }
        
        .chat-container.minimized .chat-title {
          font-size: 14px;
        }
        
        .chat-container.minimized .toggle-btn {
          position: relative;
          right: auto;
          font-size: 24px;
          margin-left: 12px;
          min-width: 48px;
          min-height: 48px;
          padding: 12px;
        }
        
        .online-members {
          display: none;
          position: absolute;
          top: 50px;
          left: 10px;
          right: 10px;
          background: rgba(26, 26, 58, 0.98);
          border: 2px solid rgba(250, 240, 230, 0.3);
          border-radius: 8px;
          padding: 10px;
          z-index: 10;
          max-height: 150px;
          overflow-y: auto;
        }
        
        .online-members.show {
          display: block;
        }
        
        .members-toggle-btn {
          display: inline-block !important;
          background: none;
          border: none;
          color: #ff4080;
          font-size: 20px;
          cursor: pointer;
          padding: 0 8px;
          min-width: 44px;
          min-height: 44px;
        }
        
        .members-toggle-btn.active {
          color: #4ade80;
        }
        
        .chat-header {
          padding: 10px;
        }
        
        .toggle-btn {
          font-size: 28px;
          min-width: 44px;
          min-height: 44px;
          padding: 10px;
        }
        
        .chat-title {
          font-size: 14px;
        }
        
        .messages-container {
          max-height: calc(50vh - 140px);
          min-height: 150px;
        }
        
        .message-input {
          font-size: 16px; /* Prevent zoom on iOS */
          padding: 12px;
          height: 48px;
        }
        
        .send-button {
          padding: 12px 20px;
          font-size: 16px;
          min-width: 80px;
          height: 48px;
        }
        
        .emoji-button {
          width: 48px;
          height: 48px;
          font-size: 20px;
        }
        
        .emoji-picker {
          grid-template-columns: repeat(6, 1fr);
          bottom: 70px;
          max-height: 150px;
        }
        
        .emoji-item {
          font-size: 18px;
          padding: 6px;
        }
      }
      
      @media (max-width: 480px) {
        .chat-container {
          height: 45vh;
          max-height: 350px;
          width: 100vw;
          right: 0;
          left: 0;
          bottom: 0;
          border-radius: 20px 20px 0 0;
        }
        
        .messages-container {
          max-height: calc(45vh - 140px);
        }
        
        .emoji-picker {
          grid-template-columns: repeat(5, 1fr);
        }
        
        .message {
          font-size: 12px;
        }
        
        .message-author {
          font-size: 10px;
        }
        
        .message-time {
          font-size: 9px;
        }
      }
      
      /* Landscape mobile */
      @media (max-width: 768px) and (orientation: landscape) {
        .chat-container {
          height: 90vh;
          width: 60vw;
          right: 0;
        }
        
        .messages-container {
          max-height: calc(90vh - 140px);
        }
      }
      canvas {
        -moz-user-select: none;
        -webkit-user-select: none;
        -ms-user-select: none;
        user-select: none;
        position: fixed;
        width: 100%;
        max-width: 100vw;
        height: auto;
        min-height: 100vh;
        top: 0;
        left: 0;
        z-index: 0;
      }
      main {
        position: relative;
      }
      section {
        position: relative;
        width: 100vw;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
    </style>
    <link rel="stylesheet" href="/moonRoom.css" />
  </head>
  <body>
    <main>
      <section></section>
    </main>

    <!-- Chat Interface -->
    <div id="chatContainer" class="chat-container">
      <div class="chat-header">
        <span class="chat-title">🚀 ILLUMIN80 Chat</span>
        <span id="userInfo" style="font-size: 11px; color: #0064ff;"></span>
        <button id="membersToggle" class="members-toggle-btn" style="display: none;">👥</button>
        <button id="toggleChat" class="toggle-btn">−</button>
      </div>
      <div class="chat-content">
        <div class="online-members">
          <div class="members-header">Online Members</div>
          <div id="membersList" class="members-list"></div>
        </div>
        <div class="chat-main">
          <div id="messagesContainer" class="messages-container"></div>
          <div class="chat-input-container">
            <button id="emojiButton" class="emoji-button" title="Add emoji">😊</button>
            <input type="text" id="messageInput" class="message-input" placeholder="Type a message..." maxlength="200" />
            <button id="sendButton" class="send-button">Send</button>
          </div>
          <div id="emojiPicker" class="emoji-picker" style="display: none;"></div>
        </div>
      </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="/moonroom-config.js"></script>
    
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script
      async
      src="https://ga.jspm.io/npm:es-module-shims@1.6.3/dist/es-module-shims.js"
    ></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.168.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.168.0/examples/jsm/"
        }
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/libs/ammo.wasm.js"></script>

    <!-- Firebase and Chat Initialization -->
    <script>
      // Initialize Firebase with configuration from moonroom-config.js
      let database;
      try {
        firebase.initializeApp(MOONROOM_FIREBASE_CONFIG);
        database = firebase.database();
        window.database = database; // Make database globally available
        const auth = firebase.auth();
        
  
        
        // Test connection to Firebase
        // database.ref('.info/connected').on('value', function(snapshot) {
        //   if (snapshot.val() === true) {
        //     console.log('✅ Connected to Firebase Realtime Database');
        //   } else {
        //     console.warn('⚠️ Not connected to Firebase Realtime Database');
        //   }
        // });
      } catch (error) {
        console.error('Firebase initialization error:', error);
      }

      // Chat functionality
      let currentUser = null;
      let userAddress = null;
      let userRanking = null;
      let userDisplayName = null;
      let userAvatarUrl = null;
      let messages = [];
      let onlineMembers = [];
      let chatMinimized = false;
      let lastMessageTimestamp = 0;

      // DOM elements
      let messageInput, sendButton, messagesContainer, membersList, chatContainer, toggleBtn, emojiButton, emojiPicker, membersToggle;

      // Initialize chat after DOM loads
      document.addEventListener('DOMContentLoaded', function() {
        messageInput = document.getElementById('messageInput');
        sendButton = document.getElementById('sendButton');
        messagesContainer = document.getElementById('messagesContainer');
        membersList = document.getElementById('membersList');
        chatContainer = document.getElementById('chatContainer');
        toggleBtn = document.getElementById('toggleChat');
        membersToggle = document.getElementById('membersToggle');
        emojiButton = document.getElementById('emojiButton');
        emojiPicker = document.getElementById('emojiPicker');

        // Prevent event propagation from chat interface
        if (chatContainer) {
          chatContainer.addEventListener('pointerdown', function(e) {
            e.stopPropagation();
          });
          chatContainer.addEventListener('pointermove', function(e) {
            e.stopPropagation();
          });
          chatContainer.addEventListener('pointerup', function(e) {
            e.stopPropagation();
          });
          chatContainer.addEventListener('click', function(e) {
            e.stopPropagation();
          });
        }

        // Check authentication and member status
        checkMemberAccess();

        // Set up event listeners
        sendButton.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          sendMessage();
        });
        
        messageInput.addEventListener('keypress', function(e) {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            e.stopPropagation();
            sendMessage();
          }
        });

        toggleBtn.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          toggleChat();
        });
        
        // Mobile members toggle
        if (membersToggle) {
          membersToggle.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            const membersList = document.querySelector('.online-members');
            membersList.classList.toggle('show');
            membersToggle.classList.toggle('active');
          });
        }

        // Initialize emoji picker
        initializeEmojiPicker();
        
        // Emoji button click handler
        emojiButton.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          toggleEmojiPicker();
        });

        // Close emoji picker when clicking outside
        document.addEventListener('click', function(e) {
          if (!emojiPicker.contains(e.target) && e.target !== emojiButton) {
            emojiPicker.style.display = 'none';
          }
        });
      });

      function checkMemberAccess() {
        // Add performance monitoring
        let frameCount = 0;
        let lastTime = performance.now();
        setInterval(() => {
          const now = performance.now();
          const fps = Math.round(frameCount * 1000 / (now - lastTime));
          frameCount = 0;
          lastTime = now;
          
          // Warn if FPS drops below 30
          if (fps < 30 && fps > 0) {
            console.warn(`Low FPS: ${fps}. Consider reducing activity.`);
          }
        }, 1000);
        
        // Track frame updates
        function countFrame() {
          frameCount++;
          requestAnimationFrame(countFrame);
        }
        countFrame();
        
        // Get user info from localStorage or session
        // First check if we have stored credentials
        userAddress = localStorage.getItem('walletAddress');
        userRanking = localStorage.getItem('memberRanking');
        userDisplayName = localStorage.getItem('userDisplayName');
        
        // Check if we have Clerk user data injected by the server
        if (window.CLERK_USER_DATA) {
          userAddress = window.CLERK_USER_DATA.userId;
          userRanking = window.CLERK_USER_DATA.illumin80Rank;
          userDisplayName = window.CLERK_USER_DATA.displayName;
          userAvatarUrl = window.CLERK_USER_DATA.avatarUrl;
        }

        // If not, check URL parameters (for when redirected from main app)
        const urlParams = new URLSearchParams(window.location.search);
        const urlAddress = urlParams.get('address');
        const urlRanking = urlParams.get('ranking');
        
        if (urlAddress && urlRanking) {
          userAddress = urlAddress;
          userRanking = urlRanking;
          localStorage.setItem('walletAddress', userAddress);
          localStorage.setItem('memberRanking', userRanking);
        }

        // Check if we're in an iframe and try to get data from parent
        if (window.parent !== window && !userAddress) {
          try {
            // Try to communicate with parent window
            window.parent.postMessage({ type: 'REQUEST_USER_INFO' }, '*');
            
            // Listen for response
            window.addEventListener('message', function(event) {
              if (event.data && event.data.type === 'USER_INFO') {
                userAddress = event.data.address;
                userRanking = event.data.ranking;
                localStorage.setItem('walletAddress', userAddress);
                localStorage.setItem('memberRanking', userRanking);
                updateUserDisplay();
              }
            });
          } catch (e) {
            console.log('Could not communicate with parent window:', e);
          }
        }

        // If still no user, generate a test user
        if (!userAddress) {
          // Generate a test user for demo purposes
          userAddress = 'moon_' + Math.random().toString(36).substr(2, 9);
          userRanking = Math.floor(Math.random() * 80) + 1;
          localStorage.setItem('walletAddress', userAddress);
          localStorage.setItem('memberRanking', userRanking);
          
          // console.log('Generated test user:', {
          //   address: userAddress,
          //   ranking: userRanking,
          //   nickname: userDisplayName || `ILLUMIN80 #${userRanking}`
          // });
        }

        window.userAddress = userAddress; // Make userAddress globally available
        // console.log('Current user:', {
        //   address: userAddress,
        //   ranking: userRanking
        // });

        // Update the UI to show user info
        updateUserDisplay();

        // Initialize chat listeners
        initializeChatListeners();
        setUserOnline();
      }

      function updateUserDisplay() {
        const userInfoEl = document.getElementById('userInfo');
        if (userInfoEl) {
          if (userDisplayName) {
            userInfoEl.textContent = `${userDisplayName} (#${userRanking})`;
          } else if (userRanking) {
            userInfoEl.textContent = `ILLUMIN80 #${userRanking}`;
          }
        }
      }

      function initializeChatListeners() {
        // console.log('Initializing chat listeners...');
        
        if (!database) {
          console.error('Database not initialized, cannot set up listeners');
          return;
        }

        // Listen for new messages
        try {
          const chatRef = database.ref('moonRoom/chat');

          
          chatRef.orderByChild('timestamp').limitToLast(50).on('value', (snapshot) => {
            const data = snapshot.val();
            
            messages = [];
            let newestTimestamp = 0;
            let newestNonBotTimestamp = 0;
            if (data) {
              Object.keys(data).forEach(key => {
                const msg = { ...data[key], id: key };
                messages.push(msg);
                if (msg.timestamp > newestTimestamp) {
                  newestTimestamp = msg.timestamp;
                }

      // Scene control variables
      let currentLoadedModels = [];
      
      // Command voting system
      const commandVotes = new Map(); // Track votes for each command
      const voteTimeout = 30000; // 30 seconds to collect votes
      
      // Dynamic vote requirement based on users online
      function getVotesRequired() {
        if (!window.database) return 1;
        
        // Get the number of active users from the members list
        const membersCount = Object.keys(window.currentMembers || {}).length;
        
        // 1 user = instant execution (no voting needed)
        if (membersCount <= 1) return 1;
        
        // Calculate 20% of users (minimum 2)
        const twentyPercent = Math.ceil(membersCount * 0.2);
        
        // Return the greater of: 2 users or 20% of users
        // This means: 2-9 users need 2 votes, 10+ users need 20%
        return Math.max(2, twentyPercent);
      }
      
      // Process command votes from Firebase
      function processCommandVote(message, userId, timestamp) {
        const trimmedMessage = message.trim();
        const lowerMessage = trimmedMessage.toLowerCase();
        
        // Check if it's a slash command
        const isSlashCommand = trimmedMessage.startsWith('/');
        
        // Remove slash if present for processing
        const commandMessage = isSlashCommand ? lowerMessage.substring(1) : lowerMessage;
        
        // Ignore help/commands - these should work immediately
        if (commandMessage === 'help' || commandMessage === 'commands' || commandMessage === '?') {
          if (userId === window.userAddress) {
            showSceneCommands();
          }
          return;
        }
        
        // Get normalized command for voting
        const normalizedCommand = getNormalizedCommand(commandMessage);
        if (!normalizedCommand) return;
        
        // Track the vote in Firebase
        if (window.database) {
          const voteRef = window.database.ref(`moonRoom/commandVotes/${normalizedCommand}`);
          
          voteRef.once('value', (snapshot) => {
            const voteData = snapshot.val() || { voters: {}, firstVoteTime: timestamp };
            const votesRequired = getVotesRequired();
            
            // If only 1 vote required (single user), execute immediately
            if (votesRequired === 1) {
              executeSceneCommand(normalizedCommand);
              return;
            }
            
            // Check if voting period expired (30 seconds from first vote)
            if (timestamp - voteData.firstVoteTime > voteTimeout) {
              // Reset voting for this command
              voteRef.set({
                voters: { [userId]: true },
                firstVoteTime: timestamp,
                command: normalizedCommand
              });
              
              // Announce new vote
              const membersCount = Object.keys(window.currentMembers || {}).length;
              sendBotMessage(`🗳️ ${userId === window.userAddress ? 'You' : 'A user'} started a vote for: "${normalizedCommand}" (1/${votesRequired} votes needed, ${membersCount} users online)`);
            } else {
              // Add vote if user hasn't voted yet
              if (!voteData.voters[userId]) {
                voteData.voters[userId] = true;
                const voteCount = Object.keys(voteData.voters).length;
                
                voteRef.set(voteData);
                
                if (voteCount >= votesRequired) {
                  // Execute the command for all users!
                  executeSceneCommand(normalizedCommand);
                  sendBotMessage(`✅ Command "${normalizedCommand}" executed! (${voteCount}/${votesRequired} votes)`);
                  
                  // Clear the votes
                  voteRef.remove();
                } else {
                  // Announce vote progress
                  sendBotMessage(`🗳️ Vote recorded for: "${normalizedCommand}" (${voteCount}/${votesRequired} votes needed)`);
                }
              } else {
                // User already voted
                if (userId === window.userAddress) {
                  sendBotMessage(`⚠️ You already voted for: "${normalizedCommand}"`);
                }
              }
            }
          });
        } else {
          // Fallback for single user
          executeSceneCommand(normalizedCommand);
        }
      }
      
      // Normalize commands for voting
      function getNormalizedCommand(commandMessage) {
        // Map various command forms to normalized versions
        if (commandMessage === 'hide' || commandMessage === 'hide tentacle') {
          return 'tentacle_hide';
        }
        if (commandMessage === 'tentacle') {
          return 'load_tentacle';
        }
        if (commandMessage.startsWith('moon ') || commandMessage.startsWith('color ')) {
          const colorMatch = commandMessage.match(/(?:moon |color )(\w+)/);
          if (colorMatch) return `moon_${colorMatch[1]}`;
          return 'moon_random';
        }
        if (commandMessage === 'lights off' || commandMessage === 'dark') return 'lights_dark';
        if (commandMessage === 'lights on' || commandMessage === 'bright') return 'lights_bright';
        if (commandMessage === 'disco' || commandMessage === 'party') return 'lights_disco';
        if (commandMessage === 'spawn moon') return 'spawn_moon';
        if (commandMessage === 'spawn ball') return 'spawn_ball';
        if (commandMessage === 'camera spin' || commandMessage === 'spin') return 'camera_spin';
        if (commandMessage === 'camera stop' || commandMessage === 'stop') return 'camera_stop';
        if (commandMessage === 'camera shake' || commandMessage === 'shake') return 'camera_shake';
        if (commandMessage === 'mary') return 'load_mary';
        if (commandMessage.startsWith('load ')) {
          const modelMatch = commandMessage.match(/load (\w+)/);
          if (modelMatch) return `load_${modelMatch[1]}`;
        }
        
        return null; // Unknown command

        cleanupOldProjectiles() {

          this.projectilesRef.once('value', (snapshot) => {
            const projectiles = snapshot.val();
            if (!projectiles) return;
            
            const projectileArray = Object.keys(projectiles).map(key => ({
              key,
              timestamp: projectiles[key].timestamp
            }));
            
            // Sort by timestamp (newest first)
            projectileArray.sort((a, b) => b.timestamp - a.timestamp);
            
            // Remove all but the most recent 15 (reduced for better performance)
            if (projectileArray.length > 15) {
              for (let i = 15; i < projectileArray.length; i++) {

            const velocity = new THREE.Vector3(
              projectileData.direction.x * projectileData.force,

            );

        createSharedMoons() {

        checkHostStatus() {
          return new Promise((resolve) => {
            // Use a more stable host determination - alphabetically first member
            const membersRef = this.database.ref('moonRoom/members');
            
            // Get initial host status
            membersRef.once('value', (snapshot) => {
              const members = snapshot.val() || {};
              const sortedMembers = Object.keys(members).sort();
              this.isHost = sortedMembers.length > 0 && sortedMembers[0] === this.localUserAddress;
              console.log(`Initial host status: ${this.isHost ? 'HOST' : 'NOT HOST'} (${this.localUserAddress})`);
              console.log('Sorted members in room:', sortedMembers);
              resolve();
            });
            
            // Then listen for changes
            membersRef.on('value', (snapshot) => {
              const members = snapshot.val() || {};
              const sortedMembers = Object.keys(members).sort();
              const wasHost = this.isHost;
              this.isHost = sortedMembers.length > 0 && sortedMembers[0] === this.localUserAddress;
              
              if (this.isHost !== wasHost) {
                console.log(this.isHost ? 'Became host for shared moons' : 'No longer host');
                console.log('Current sorted members:', sortedMembers);
                
                if (this.isHost) {
                  // New host - start syncing
                  this.startHostSync();
                } else {
                  // No longer host - stop syncing
                  if (this.syncInterval) {
                    clearInterval(this.syncInterval);
                    this.syncInterval = null;
                  }
                }
                
                // Update physics for all moons
                this.sharedMoons.forEach((moon, moonId) => {
                  const body = window.meshMap?.get(moon);
                  if (body && window.Ammo) {
                    // All players keep dynamic physics for local collision detection
                    // The host's physics is authoritative and syncs to others
                    body.setMassProps(0.5, new Ammo.btVector3(1, 1, 1));
                    body.activate(true);
                  }
                });
              }
            });
          });
        }
        
        startHostSync() {
          // Only host syncs moon positions
          if (!this.isHost || this.syncInterval) return;
          
          console.log('Starting host sync for moons');
          
          // Use throttled updates to avoid overwhelming Firebase
          this.syncInterval = setInterval(() => {
            if (!this.isHost) {
              clearInterval(this.syncInterval);
              this.syncInterval = null;
              return;
            }
            
            this.sharedMoons.forEach((moon, moonId) => {

              if (body && body.getMotionState) {
                const vel = body.getLinearVelocity();

                // Always update positions for consistency
                this.moonsRef.child(moonId).update({
                  position: {
                    x: moon.position.x,
                    y: moon.position.y,
                    z: moon.position.z
                  },
                  rotation: {
                    x: moon.rotation.x,
                    y: moon.rotation.y,
                    z: moon.rotation.z
                  },
                  velocity: speed > 0.1 ? {
                    x: vel.x(),
                    y: vel.y(),

          this.moonHitsRef.push({

      }

      // Make MultiplayerProjectiles available globally
      window.MultiplayerProjectiles = MultiplayerProjectiles;
      const meshes = [];
      let isDragging = false;
      let selectedObject = null;
      let previousMousePosition = new THREE.Vector2();
      let dragStartPosition = new THREE.Vector3();
      const mouse = new THREE.Vector2();
      const dragPlane = new THREE.Plane();
      const intersection = new THREE.Vector3();
      const mousePosition = new THREE.Vector2();
      const raycaster = new THREE.Raycaster();
      const meshMap = new WeakMap();
      window.meshMap = meshMap; // Make meshMap globally accessible
      async function AmmoPhysics() {
        if (!("Ammo" in window)) {
          console.error("AmmoPhysics: Couldn't find Ammo.js");
          return;
        }

        const Ammo = await window.Ammo();
        const collisionConfiguration =
          new Ammo.btDefaultCollisionConfiguration();
        const dispatcher = new Ammo.btCollisionDispatcher(
          collisionConfiguration
        );
        const broadphase = new Ammo.btDbvtBroadphase();
        const solver = new Ammo.btSequentialImpulseConstraintSolver();
        const world = new Ammo.btDiscreteDynamicsWorld(
          dispatcher,
          broadphase,
          solver,
          collisionConfiguration
        );
        world.setGravity(new Ammo.btVector3(0, -10, 0));

        let transform = new Ammo.btTransform();
        const worldTransform = new Ammo.btTransform();
        let position,
          quaternion = new Ammo.btVector3(0, 0, 0);
        let quaternion_bt = new Ammo.btQuaternion(0, 0, 0, 0);
        let vector = new Ammo.btVector3(0, 0, 0);

        const meshes = [];
        // const meshMap = new WeakMap();

        let shootingShapeSaved = null;
        let shootingShapeName = "";

        function createConvexHullShape(geometry) {
          let shape = null;
          let vector = new Ammo.btVector3(0, 0, 0);
          let positions = geometry.attributes.position.array;

          shape = new Ammo.btConvexHullShape();
          for (let i = 0, il = positions.length; i < il; i += 3) {
            vector.setValue(positions[i], positions[i + 1], positions[i + 2]);
            const lastOne = i >= il - 3;
            shape.addPoint(vector, lastOne);
          }

          if (shape) shape.setMargin(0);
          if (!shape) console.error("AmmoPhysics: Shape error.");
          return shape;
        }

        function createBoxShape(width, height, depth) {
          const shape = new Ammo.btBoxShape(new Ammo.btVector3(width * 0.5, height * 0.5, depth * 0.5));
          shape.setMargin(0.05);
          return shape;
        }
        
        function createCylinderShape(radius, height) {
          const shape = new Ammo.btCylinderShape(new Ammo.btVector3(radius, height * 0.5, radius));
          shape.setMargin(0.05);
          return shape;
        }
        
        function createTerrainShape(geometry) {
          let shape = null;
          
          if (!geometry || !geometry.attributes || !geometry.attributes.position) {
            console.error("Invalid geometry for terrain shape");
            return null;
          }
          
          const positions = geometry.attributes.position.array;
          const mesh = new Ammo.btTriangleMesh();

          if (geometry.index) {
            // Indexed geometry
            const indices = geometry.index.array;
            for (let i = 0; i < indices.length; i += 3) {
              const v1 = new Ammo.btVector3(
                positions[indices[i] * 3],
                positions[indices[i] * 3 + 1],
                positions[indices[i] * 3 + 2]
              );
              const v2 = new Ammo.btVector3(
                positions[indices[i + 1] * 3],
                positions[indices[i + 1] * 3 + 1],
                positions[indices[i + 1] * 3 + 2]
              );
              const v3 = new Ammo.btVector3(
                positions[indices[i + 2] * 3],
                positions[indices[i + 2] * 3 + 1],
                positions[indices[i + 2] * 3 + 2]
              );
              mesh.addTriangle(v1, v2, v3);
            }
          } else {
            // Non-indexed geometry - every 3 vertices form a triangle
            for (let i = 0; i < positions.length; i += 9) {
              const v1 = new Ammo.btVector3(
                positions[i],
                positions[i + 1],
                positions[i + 2]
              );
              const v2 = new Ammo.btVector3(
                positions[i + 3],
                positions[i + 4],
                positions[i + 5]
              );
              const v3 = new Ammo.btVector3(
                positions[i + 6],
                positions[i + 7],
                positions[i + 8]
              );
              mesh.addTriangle(v1, v2, v3);
            }
          }

          shape = new Ammo.btBvhTriangleMeshShape(mesh, true, true);
          if (shape) shape.setMargin(0);

          return shape;
        }

        function addRigidBody(threeObject, mass, shape, velocity = null) {
          position = threeObject.position;
          quaternion = threeObject.quaternion;

          transform.setIdentity();
          vector.setValue(position.x, position.y, position.z);
          transform.setOrigin(vector);
          transform.setRotation(
            new Ammo.btQuaternion(
              quaternion.x,
              quaternion.y,
              quaternion.z,
              quaternion.w
            )
          );

          const scale = threeObject.scale;
          vector.setValue(scale.x, scale.y, scale.z);
          shape.setLocalScaling(vector);
          vector.setValue(0, 0, 0);

          const motionState = new Ammo.btDefaultMotionState(transform);
          const localInertia = vector;
          if (mass > 0) shape.calculateLocalInertia(mass, localInertia);

          const rbInfo = new Ammo.btRigidBodyConstructionInfo(
            mass,
            motionState,
            shape,
            localInertia
          );
          const body = new Ammo.btRigidBody(rbInfo);

          if (threeObject.name === "pointLight") {
            body.setFriction(0.1);
            body.setRestitution(0.7);
          } else if (threeObject.name === "floor") {
            body.setFriction(1);
            body.setRestitution(1);
            body.setDamping(0, 0);
          } else {
            body.setFriction(0.5);
            body.setRestitution(0.3);
            body.setDamping(0, 0);
          }

          if (threeObject.name === "shootingBall" && velocity) {
            vector.setValue(velocity.x, velocity.y, velocity.z);
            body.setLinearVelocity(vector);
          }

          body.name = threeObject.name;
          world.addRigidBody(body);

          if (mass > 0) {
            meshes.push(threeObject);
            meshMap.set(threeObject, body);
          }
        }

        // Set up physics update interval
        let lastTime = performance.now();
        setInterval(function () {
          const time = performance.now();
          if (lastTime > 0) {
            const delta = (time - lastTime) / 1000;
            world.stepSimulation(delta, 10);
            
            // Check for collisions with the tentacle
            const dispatcher = world.getDispatcher();
            const numManifolds = dispatcher.getNumManifolds();
            
            // Debug: Log if we have any manifolds at all
            if (numManifolds > 0 && !window.debuggedManifolds) {
              console.log("Physics system has", numManifolds, "collision manifolds");
              window.debuggedManifolds = true;
            }
            
            for (let i = 0; i < numManifolds; i++) {
              const manifold = dispatcher.getManifoldByIndexInternal(i);
              const body0 = manifold.getBody0();
              const body1 = manifold.getBody1();
              
              // Check if this is a collision between a shooting ball and tentacle collision box
              let ballMesh = null;
              let tentacleCollision = false;
              let collisionDetails = null;
              
              // Find which body is the ball
              meshes.forEach(mesh => {
                const body = meshMap.get(mesh);
                if (body === body0 || body === body1) {
                  if (mesh.name === "shootingBall") {
                    ballMesh = mesh;
                  }
                }
              });
              
              // Only check tentacle collision if we found a ball
              if (ballMesh) {
                // Simple approach: Check all meshes for tentacle collision
                meshes.forEach(mesh => {
                  const meshBody = meshMap.get(mesh);
                  if (meshBody && (meshBody === body0 || meshBody === body1)) {
                    // Check if this mesh is part of the tentacle
                    if (mesh.name === 'Object_8' || 
                        mesh.name === 'TrapTentacle_Trap_Tentacle_0' ||
                        mesh.name.includes('Tentacle') ||
                        (mesh.parent && mesh.parent.name === 'chair')) {
                      tentacleCollision = true;
                      
                      // Find and trigger the animation
                      if (mesh.parent && mesh.parent.triggerHideAnimation) {
                        mesh.parent.triggerHideAnimation();
                      } else if (window.tentacleChair && window.tentacleChair.triggerHideAnimation) {
                        window.tentacleChair.triggerHideAnimation();
                      } else {
                        // Try to find the animation function
                        let chairObj = mesh.parent;
                        while (chairObj && !chairObj.triggerHideAnimation) {
                          chairObj = chairObj.parent;
                        }
                        if (chairObj && chairObj.triggerHideAnimation) {
                          chairObj.triggerHideAnimation();
                        }
                      }
                    }
                    
                    // Also check collision boxes
                    if (window.tentacleChair && window.tentacleChair.collisionBoxes) {
                      window.tentacleChair.collisionBoxes.forEach((box) => {
                        if (mesh === box) {
                          tentacleCollision = true;
                          if (window.tentacleChair.triggerHideAnimation) {
                            window.tentacleChair.triggerHideAnimation();
                          }
                        }
                      });
                    }
                  }
                });
              }
            }
          }
          lastTime = time;

          for (let i = 0, il = meshes.length; i < il; i++) {
            const mesh = meshes[i];
            if (!mesh || (isDragging && mesh === selectedObject)) continue;

            // For multiplayer moons, only update from physics if we're the host
            // Non-hosts get their positions from Firebase updates
            if (mesh.name && mesh.name.startsWith('multiplayer_moon_')) {
              if (window.multiplayerProjectiles && !window.multiplayerProjectiles.isHost) {
                continue; // Non-hosts don't update from local physics
              }
              // Host continues to update normally from physics
            }

            if (mesh.isInstancedMesh) {
              const array = mesh.instanceMatrix.array;
              const bodies = meshMap.get(mesh);
              for (let j = 0; j < bodies.length; j++) {
                const body = bodies[j];
                if (!body) continue;

                body.getMotionState().getWorldTransform(worldTransform);
                const origin = worldTransform.getOrigin();
                const rotation = worldTransform.getRotation();
                computeQuaternionFromMatrix(origin, rotation, array, j * 16);
              }
              mesh.instanceMatrix.needsUpdate = true;
            } else if (mesh.isMesh) {
              const body = meshMap.get(mesh);
              if (!body) continue;

              body.getMotionState().getWorldTransform(worldTransform);
              const origin = worldTransform.getOrigin();
              const rotation = worldTransform.getRotation();
              mesh.position.set(origin.x(), origin.y(), origin.z());
              mesh.quaternion.set(
                rotation.x(),
                rotation.y(),
                rotation.z(),
                rotation.w()
              );
            }
          }
        }, 1000 / 60);

        return {
          addMesh: function (mesh, mass = 0) {
            const shape = createConvexHullShape(mesh.geometry);
            if (!shape) {
              console.error("AmmoPhysics: Shape is NULL.");
              return false;
            }
            addRigidBody(mesh, mass, shape);
          },
          
          addBoxMesh: function (mesh, mass = 0, width, height, depth) {
            const shape = createBoxShape(width, height, depth);
            if (!shape) {
              console.error("AmmoPhysics: Box shape is NULL.");
              return false;
            }
            addRigidBody(mesh, mass, shape);
          },
          
          addCylinderMesh: function (mesh, mass = 0, radius, height) {
            const shape = createCylinderShape(radius, height);
            if (!shape) {
              console.error("AmmoPhysics: Cylinder shape is NULL.");
              return false;
            }
            addRigidBody(mesh, mass, shape);
          },

          addTerrainMesh: function (mesh, mass = 0) {
            const shape = createTerrainShape(mesh.geometry);
            if (!shape) {
              console.error("AmmoPhysics: Shape is NULL.");
              return false;
            }
            addRigidBody(mesh, mass, shape);
          },

          addShootingMesh: function (mesh, mass = 0, velocity = null) {
            if (!velocity) {
              console.error("AmmoPhysics: Parameter is NULL.");
              return false;
            }

            if (!mesh.name || (mesh.name && mesh.name !== shootingShapeName)) {
              shootingShapeSaved = createConvexHullShape(mesh.geometry);
              shootingShapeName = mesh.name;
            }

            if (!shootingShapeSaved) {
              console.error("AmmoPhysics: Shape is NULL.");
              return false;
            }

            addRigidBody(mesh, mass, shootingShapeSaved, velocity);
            
            // Add tracking for cleanup
            mesh.isProjectile = true;
          },
          
          removeBody: function(body) {
            if (body) {
              world.removeRigidBody(body);
            }
          },
        };
      }

      function computeQuaternionFromMatrix(e, t, n, o) {
        const i = t.x(),
          a = t.y(),
          r = t.z(),
          s = t.w(),
          l = i + i,
          c = a + a,
          d = r + r,
          h = i * l,
          m = i * c,
          w = i * d,
          E = a * c,
          u = a * d,
          p = r * d,
          g = s * l,
          M = s * c,
          y = s * d;
        (n[o + 0] = 1 - (E + p)),
          (n[o + 1] = m + y),
          (n[o + 2] = w - M),
          (n[o + 3] = 0),
          (n[o + 4] = m - y),
          (n[o + 5] = 1 - (h + p)),
          (n[o + 6] = u + g),
          (n[o + 7] = 0),
          (n[o + 8] = w + M),
          (n[o + 9] = u - g),
          (n[o + 10] = 1 - (h + E)),
          (n[o + 11] = 0),
          (n[o + 12] = e.x()),
          (n[o + 13] = e.y()),
          (n[o + 14] = e.z()),
          (n[o + 15] = 1);
      }

      // Main initialization
      (async function init() {
        let physics = await AmmoPhysics();
        window.physics = physics; // Make physics globally accessible
        let camera, scene, renderer, controls;
        let sphereGeom, sphereMat, light, chair;
        let intensity = 40;
        let color = 0x1a1a3a;
        const HEIGHT = 5;

                  wireframe: true,
                  color: 0x00ff00,
                  transparent: true,
                  opacity: 0.5
                })
              );
              
              // Position at tentacle base on the floor
              collisionMesh.position.set(
                chair.position.x,
                chair.position.y,  // At floor level where tentacle base is
                chair.position.z
              );
              
              scene.add(collisionMesh);
              
              // Add physics body with high mass so it doesn't move
              physics.addBoxMesh(collisionMesh, 10000, collisionWidth, collisionHeight, collisionDepth);
              
              const collisionBody = meshMap.get(collisionMesh);
              if (collisionBody) {
                collisionBody.setDamping(0.99, 0.99);
                collisionBody.setActivationState(2); // DISABLE_DEACTIVATION
                collisionBody.setRestitution(0.5); // Some bounce
                console.log("Added invisible physics collision for tentacle");
              }
              
              /* Removed old collision boxes - using simple box instead

                // ADJUST BOX SIZES HERE!

                // Make it nearly immovable

                if (boxBody) {
                  boxBody.setDamping(0.99, 0.99); // High damping
                  boxBody.setActivationState(2); // DISABLE_DEACTIVATION
                  boxBody.setRestitution(0.5); // Add some bounce
                }
                
                chair.collisionBoxes.push(boxMesh);
                console.log(`Added collision box ${i} with proper shape at:`, boxMesh.position, "body:", boxBody);
              }
              
              console.log("Created multi-part collision system for skinned tentacle mesh");
              
              // OPTION FOR DYNAMIC COLLISION: Track bone positions
              // We can make the collision follow the animation!
              if (tentacleMesh.skeleton && tentacleMesh.skeleton.bones.length > 0) {

                        const transform = new Ammo.btTransform();

                        ));

            } else {
              // Regular mesh - use convex hull
              physics.addMesh(tentacleMesh, 0);
              console.log("Added convex hull physics to regular mesh:", tentacleMesh.name);
            }
          } else {
            console.warn("No mesh found in tentacle model!");
          }
          
          // Find the Empty mesh that contains the animated object
          let emptyMesh = null;
          chair.traverse((child) => {
            if (child.name === 'Empty') {
              emptyMesh = child;
              console.log("Found Empty mesh:", child);
            }
          });
          
          // Set up animation if the model has animations
          let mixer = null;
          let currentAction = null;
          let idleAction = null;
          let hiddenAction = null;
          let isHiding = false;
          let hideTimeout = null;
          
          console.log("Checking animations for tentacle model...");
          console.log("chairModel.animations exists:", !!chairModel.animations);
          console.log("Number of animations:", chairModel.animations ? chairModel.animations.length : 0);
          
          if (chairModel.animations && chairModel.animations.length > 0) {
            // Create mixer for the entire scene (animations might target specific objects)
            mixer = new THREE.AnimationMixer(chair);
            
            // Log available animations and what they target
            console.log("=== ALL AVAILABLE ANIMATIONS IN TENTACLE MODEL ===");
            console.log("Total animations found:", chairModel.animations.length);
            chairModel.animations.forEach((clip, index) => {
              console.log(`[${index}] Animation name: "${clip.name}"`);
              // Log what objects the animation targets
              if (clip.tracks && clip.tracks.length > 0) {
                const targetObjects = new Set(clip.tracks.map(track => track.name.split('.')[0]));
                console.log(`     Targets: ${Array.from(targetObjects).join(', ')}`);
              }
            });
            console.log("=== END OF ANIMATION LIST ===");
            
            // Find the animations we need - just Idle01 and Idle02
            let idleAnimation = chairModel.animations.find(clip => 
              clip.name === 'Armature|Idle01' || clip.name === 'Idle01'
            );
            let idle2Animation = chairModel.animations.find(clip => 
              clip.name === 'Armature|Idle02' || clip.name === 'Idle02'
            );
            
            // Set up idle animation
            if (idleAnimation) {
              idleAction = mixer.clipAction(idleAnimation);
              idleAction.setLoop(THREE.LoopRepeat);
              idleAction.play();
              currentAction = idleAction;
              // console.log(`Playing animation: ${idleAnimation.name}`);
            }
            
            // Set up Idle02 animation
            let idle2Action = null;
            
            if (idle2Animation) {
              idle2Action = mixer.clipAction(idle2Animation);
              idle2Action.setLoop(THREE.LoopOnce);
              idle2Action.clampWhenFinished = true;
              console.log("Found animation: Idle02");
            }
            
            // Function to trigger Idle02 animation on collision
            chair.triggerHideAnimation = function() {
              
              if (isHiding || !idle2Action) {
                if (isHiding) console.log("Already playing Idle02, skipping");
                if (!idle2Action) console.log("No Idle02 animation found!");
                return;
              }
              
              console.log("Collision detected! Switching to Idle02 animation");
              isHiding = true;
              
              // Clear any existing timeout
              if (hideTimeout) {
                clearTimeout(hideTimeout);
              }
              
              // Play Idle02 animation
              if (currentAction === idleAction && idle2Action) {
                // Fade from Idle01 to Idle02
                idleAction.fadeOut(0.3);
                idle2Action.reset();
                idle2Action.fadeIn(0.3);
                idle2Action.play();
                currentAction = idle2Action;
                
                // After Idle02 completes, return to Idle01
                mixer.addEventListener('finished', function onIdle2Finished(e) {
                  if (e.action === idle2Action && idleAction) {
                    mixer.removeEventListener('finished', onIdle2Finished);
                    console.log("Returning to Idle01 animation");
                    
                    // Go back to Idle01
                    idleAction.reset();
                    idleAction.fadeIn(0.3);
                    idleAction.play();
                    currentAction = idleAction;
                    isHiding = false;
                  }
                });
              }
            };
            
            // Update the existing test function with animation capability
            if (window.testTentacleHide) {
              // Update existing function
              window.testTentacleHide = function() {
                console.log("Manual test: Triggering tentacle hide animation");
                if (chair.triggerHideAnimation) {
                  chair.triggerHideAnimation();
                } else {
                  console.error("Trigger function not found!");
                }
              };
            }
            
            console.log("Tentacle animation ready. Test with: window.testTentacleHide()");
            
            // If we found the Empty mesh, we can control it directly if needed
            if (emptyMesh) {
              console.log("Empty mesh ready for additional control if needed");
            }
          } else {
            console.warn("No animations found in tentacle model!");
            
            // Create placeholder functions so we can still test
            chair.triggerHideAnimation = function() {
              console.log("triggerHideAnimation called but no animations available!");
            };
          }
          
          // Debug functions were already created earlier
          
          // Create collision for the model (excluding animated parts)
          const geometries = [];
          chair.traverse((child) => {
            if (child.isMesh && child.geometry) {
              // Skip animated/skinned meshes
              const isAnimated = child.isSkinnedMesh || 
                               child.geometry.attributes.skinIndex || 
                               child.geometry.attributes.skinWeight;
              
              if (!isAnimated) {
                // Clone geometry for static meshes only
                const clonedGeometry = child.geometry.clone();
                
                // Remove any animation attributes that might have been left
                delete clonedGeometry.attributes.skinIndex;
                delete clonedGeometry.attributes.skinWeight;
                
                clonedGeometry.applyMatrix4(child.matrixWorld);
                geometries.push(clonedGeometry);
              }
            }
          });
          
          // Create collision hull from static geometries only
          if (geometries.length > 0) {
            try {
              const mergedGeometry = BufferGeometryUtils.mergeGeometries(geometries);
              
              // Create a simplified convex hull mesh for collision
              const hullMesh = new THREE.Mesh(
                mergedGeometry,
                new THREE.MeshBasicMaterial({
                  visible: true,  // Set to false to hide
                  wireframe: true,
                  color: 0x00ff00,
                  opacity: 0.3,
                  transparent: true
                })
              );
              hullMesh.scale.copy(chair.scale);
              hullMesh.position.copy(chair.position);
              hullMesh.name = "model_hull_collision";
              
              scene.add(hullMesh);
              physics.addMesh(hullMesh, 0); // Mass 0 = static
              
              console.log("Added convex hull collision for static parts");
            } catch (err) {
              console.warn("Could not merge geometries, using bounding box:", err);
              
              // Fallback to simple box collision
              const box = new THREE.Box3().setFromObject(chair);
              const size = new THREE.Vector3();
              const center = new THREE.Vector3();
              box.getSize(size);
              box.getCenter(center);
              
              const boxGeo = new THREE.BoxGeometry(size.x, size.y, size.z);
              const boxMesh = new THREE.Mesh(boxGeo, new THREE.MeshBasicMaterial({ visible: true }));
              boxMesh.position.copy(center);
              
              scene.add(boxMesh);
              physics.addMesh(boxMesh, 0);
            }
          }

          // document.getElementById("loading").style.display = "none";

          // Animation loop
          const clock = new THREE.Clock();
          const spotlightVec = new THREE.Vector3();
          
          function animate() {
            requestAnimationFrame(animate);
            
            // Update camera effects (spinning, etc.)
            if (window.updateCameraEffects) {
              window.updateCameraEffects();
            }
            
            // Update animation mixer if it exists
            if (mixer) {
              const delta = clock.getDelta();
              mixer.update(delta);
              
              // Distance-based collision is used instead of physics bodies
              /* Removed animated collision update
              if (chair && chair.updateAnimatedCollision) {
                chair.updateAnimatedCollision();
              }
              */
            }
            
            // Update spotlight targets to follow mouse with smooth lerping
            if (spotlightTargets.length > 0) {
              // Convert mouse position to 3D world coordinates
              // mousePosition.x and y are normalized 0-1, convert to -1 to 1 then scale
              const targetX = (mousePosition.x - 0.5) * 30;
              const targetZ = (mousePosition.y - 0.5) * 30;
              
              spotlightVec.set(targetX, -3, targetZ);
              
              // Smooth lerping for both spotlight targets
              spotlightTargets[0].position.lerp(spotlightVec.clone().add(new THREE.Vector3(2, 0, 2)), 0.1);
              spotlightTargets[1].position.lerp(spotlightVec.clone().add(new THREE.Vector3(-2, 0, -2)), 0.1);
              
              // Update spotlight target matrix
              spotlightTargets[0].updateMatrixWorld();
              spotlightTargets[1].updateMatrixWorld();
              
              // Update spotlight helpers
              if (typeof spotlightHelpers !== 'undefined' && spotlightHelpers.length > 0) {
                spotlightHelpers.forEach(helper => helper.update());
              }
            }
            
            controls.update();
            renderer.render(scene, camera);
          }
          animate();
          
          // Track mouse position for spotlight effect
          window.addEventListener("mousemove", (event) => {
            mousePosition.x = event.clientX / window.innerWidth;
            mousePosition.y = event.clientY / window.innerHeight;
          });

          window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
          });
        }).catch(error => {
          console.error("❌ Error in Promise.all:", error);
          console.error("Full error details:", error.stack);
          
          // Create debug functions even on error
          window.debugTentacleCollision = function() {
            console.log("Debug function (created after error)");
            console.log("Error was:", error);
          };
        });
      })();
    </script>

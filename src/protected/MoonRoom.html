<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moon Room</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Lato&display=swap");
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        overscroll-behavior-x: none;
        overscroll-behavior-y: none;
        scroll-behavior: smooth;
      }
      body {
        font-family: "Lato", sans-serif;
        position: relative;
        width: 100%;
        max-width: 100vw;
        height: auto;
        min-height: 100vh;
        text-align: center;
        overflow-x: hidden;

        background: #1b1724;
        color: #1b1724;
      }

      /* Chat Interface Styles */
      .chat-container {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 440px;
        height: 500px;
        background: rgba(26, 26, 58, 0.95);
        border: 2px solid rgba(250, 240, 230, 0.2);
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        z-index: 1000;
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        transition: all 0.3s ease;
      }

      .chat-container.minimized {
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
      }
      
      .chat-container.minimized.new-message {
        animation: pulse 1s infinite !important;
        background: rgba(255, 100, 100, 0.95) !important;
        border: 2px solid rgba(255, 200, 200, 0.8) !important;
        box-shadow: 0 0 20px rgba(255, 100, 100, 0.8) !important;
      }
      
      @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
      }

      .chat-header {
        padding: 12px 16px;
        background: rgba(26, 26, 58, 0.8);
        border-bottom: 1px solid rgba(250, 240, 230, 0.1);
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-radius: 12px 12px 0 0;
      }

      .chat-title {
        color: #faf0e6;
        font-weight: bold;
        font-size: 16px;
      }

      .toggle-btn {
        background: none;
        border: none;
        color: #faf0e6;
        font-size: 20px;
        cursor: pointer;
        padding: 0 8px;
        transition: transform 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 32px;
        min-height: 32px;
      }

      .toggle-btn:hover {
        transform: scale(1.1);
      }

      .chat-content {
        flex: 1;
        display: flex;
        overflow: hidden;
      }

      .chat-container.minimized .chat-content {
        display: none;
      }

      .online-members {
        width: 120px;
        background: rgba(26, 26, 58, 0.5);
        border-right: 1px solid rgba(250, 240, 230, 0.1);
        padding: 10px;
      }

      .members-header {
        color: #faf0e6;
        font-size: 12px;
        font-weight: bold;
        margin-bottom: 10px;
        text-align: left;
      }

      .members-list {
        color: #faf0e6;
        font-size: 11px;
      }

      .member-item {
        padding: 4px 0;
        text-align: left;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .member-item.online {
        color: #4ade80;
      }
      
      .member-avatar {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 1px solid rgba(255, 215, 0, 0.3);
        object-fit: cover;
        flex-shrink: 0;
      }
      
      .member-avatar.default {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        font-size: 11px;
        font-weight: bold;
      }
      
      .member-name {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .chat-main {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .messages-container {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .message {
        background: rgba(250, 240, 230, 0.05);
        border-radius: 8px;
        padding: 8px 12px;
        color: #faf0e6;
        text-align: left;
        animation: fadeIn 0.3s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message-author {
        font-size: 11px;
        color: #a0a0ff;
        margin-bottom: 4px;
        font-weight: bold;
      }

      .message-text {
        font-size: 13px;
        word-wrap: break-word;
      }

      .message-time {
        font-size: 10px;
        color: rgba(250, 240, 230, 0.4);
        margin-top: 4px;
      }

      .chat-input-container {
        padding: 10px;
        border-top: 1px solid rgba(250, 240, 230, 0.1);
        display: flex;
        gap: 8px;
      }

      .message-input {
        flex: 1;
        background: rgba(250, 240, 230, 0.05);
        border: 1px solid rgba(250, 240, 230, 0.2);
        border-radius: 6px;
        padding: 8px 12px;
        color: #faf0e6;
        font-size: 13px;
        outline: none;
      }

      .message-input:focus {
        border-color: rgba(250, 240, 230, 0.4);
        background: rgba(250, 240, 230, 0.08);
      }

      .message-input::placeholder {
        color: rgba(250, 240, 230, 0.3);
      }

      .send-button {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        border-radius: 6px;
        padding: 8px 16px;
        color: #faf0e6;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s;
      }

      .send-button:hover {
        transform: scale(1.05);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      }

      .send-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* Emoji Picker Styles */
      .emoji-button {
        background: rgba(250, 240, 230, 0.1);
        border: 1px solid rgba(250, 240, 230, 0.2);
        border-radius: 6px;
        padding: 8px;
        color: #faf0e6;
        font-size: 18px;
        cursor: pointer;
        transition: all 0.3s;
        margin-right: 8px;
      }

      .emoji-button:hover {
        background: rgba(250, 240, 230, 0.2);
        transform: scale(1.1);
      }

      .emoji-picker {
        position: absolute;
        bottom: 60px;
        left: 10px;
        right: 10px;
        background: rgba(26, 26, 58, 0.98);
        border: 1px solid rgba(250, 240, 230, 0.2);
        border-radius: 8px;
        padding: 10px;
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 5px;
        max-height: 200px;
        overflow-y: auto;
        backdrop-filter: blur(10px);
        z-index: 10;
      }

      .emoji-item {
        background: rgba(250, 240, 230, 0.05);
        border: 1px solid transparent;
        border-radius: 4px;
        padding: 8px;
        font-size: 20px;
        cursor: pointer;
        text-align: center;
        transition: all 0.2s;
      }

      .emoji-item:hover {
        background: rgba(250, 240, 230, 0.2);
        border-color: rgba(250, 240, 230, 0.3);
        transform: scale(1.2);
      }

      .emoji-category {
        grid-column: span 8;
        color: #a0a0ff;
        font-size: 11px;
        font-weight: bold;
        margin: 5px 0;
        padding: 5px;
        border-bottom: 1px solid rgba(250, 240, 230, 0.1);
      }

      /* Scrollbar Styles */
      .messages-container::-webkit-scrollbar {
        width: 6px;
      }

      .messages-container::-webkit-scrollbar-track {
        background: rgba(250, 240, 230, 0.05);
      }

      .messages-container::-webkit-scrollbar-thumb {
        background: rgba(250, 240, 230, 0.2);
        border-radius: 3px;
      }

      .messages-container::-webkit-scrollbar-thumb:hover {
        background: rgba(250, 240, 230, 0.3);
      }

      /* Mobile Responsive */
      @media (max-width: 768px) {
        .chat-container {
          width: calc(100vw - 20px);
          height: 50vh;
          max-height: 400px;
          right: 10px;
          bottom: 10px;
          left: 10px;
          border-radius: 12px;
          border: 2px solid rgba(250, 240, 230, 0.3);
          font-size: 16px; /* Prevent zoom on iOS */
          box-shadow: 0 -2px 20px rgba(0, 0, 0, 0.3);
        }
        
        .chat-container.minimized {
          height: 50px;
          width: auto;
          min-width: 120px;
          right: 10px;
          bottom: 10px;
          left: auto;
          border-radius: 25px;
          background: rgba(102, 126, 234, 0.95);
          border: 2px solid rgba(250, 240, 230, 0.4);
          padding: 0 15px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        
        .chat-container.minimized.new-message {
          animation: pulse 1s infinite !important;
          background: rgba(255, 100, 100, 0.95) !important;
          border: 2px solid rgba(255, 200, 200, 0.8) !important;
          box-shadow: 0 0 20px rgba(255, 100, 100, 0.8) !important;
        }
        
        .chat-container.minimized .chat-header {
          border: none;
          background: transparent;
          justify-content: center;
          align-items: center;
          padding: 0;
          display: flex;
        }
        
        .chat-container.minimized .members-toggle-btn {
          display: none !important;
        }
        
        .chat-container.minimized .chat-title {
          font-size: 14px;
        }
        
        .chat-container.minimized .toggle-btn {
          position: relative;
          right: auto;
          font-size: 24px;
          margin-left: 12px;
          min-width: 48px;
          min-height: 48px;
          padding: 12px;
        }
        
        .online-members {
          display: none;
          position: absolute;
          top: 50px;
          left: 10px;
          right: 10px;
          background: rgba(26, 26, 58, 0.98);
          border: 2px solid rgba(250, 240, 230, 0.3);
          border-radius: 8px;
          padding: 10px;
          z-index: 10;
          max-height: 150px;
          overflow-y: auto;
        }
        
        .online-members.show {
          display: block;
        }
        
        .members-toggle-btn {
          display: inline-block !important;
          background: none;
          border: none;
          color: #faf0e6;
          font-size: 20px;
          cursor: pointer;
          padding: 0 8px;
          min-width: 44px;
          min-height: 44px;
        }
        
        .members-toggle-btn.active {
          color: #4ade80;
        }
        
        .chat-header {
          padding: 10px;
        }
        
        .toggle-btn {
          font-size: 28px;
          min-width: 44px;
          min-height: 44px;
          padding: 10px;
        }
        
        .chat-title {
          font-size: 14px;
        }
        
        .messages-container {
          max-height: calc(50vh - 140px);
          min-height: 150px;
        }
        
        .message-input {
          font-size: 16px; /* Prevent zoom on iOS */
          padding: 12px;
          height: 48px;
        }
        
        .send-button {
          padding: 12px 20px;
          font-size: 16px;
          min-width: 80px;
          height: 48px;
        }
        
        .emoji-button {
          width: 48px;
          height: 48px;
          font-size: 20px;
        }
        
        .emoji-picker {
          grid-template-columns: repeat(6, 1fr);
          bottom: 70px;
          max-height: 150px;
        }
        
        .emoji-item {
          font-size: 18px;
          padding: 6px;
        }
      }
      
      @media (max-width: 480px) {
        .chat-container {
          height: 45vh;
          max-height: 350px;
          width: 100vw;
          right: 0;
          left: 0;
          bottom: 0;
          border-radius: 20px 20px 0 0;
        }
        
        .messages-container {
          max-height: calc(45vh - 140px);
        }
        
        .emoji-picker {
          grid-template-columns: repeat(5, 1fr);
        }
        
        .message {
          font-size: 12px;
        }
        
        .message-author {
          font-size: 10px;
        }
        
        .message-time {
          font-size: 9px;
        }
      }
      
      /* Landscape mobile */
      @media (max-width: 768px) and (orientation: landscape) {
        .chat-container {
          height: 90vh;
          width: 60vw;
          right: 0;
        }
        
        .messages-container {
          max-height: calc(90vh - 140px);
        }
      }
      canvas {
        -moz-user-select: none;
        -webkit-user-select: none;
        -ms-user-select: none;
        user-select: none;
        position: fixed;
        width: 100%;
        max-width: 100vw;
        height: auto;
        min-height: 100vh;
        top: 0;
        left: 0;
        z-index: 0;
      }
      main {
        position: relative;
      }
      section {
        position: relative;
        width: 100vw;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
    </style>
    <link rel="stylesheet" href="/moonRoom.css" />
  </head>
  <body>
    <main>
      <section></section>
    </main>

    <!-- Chat Interface -->
    <div id="chatContainer" class="chat-container">
      <div class="chat-header">
        <span class="chat-title">🌙 ILLUMIN80 Chat</span>
        <span id="userInfo" style="font-size: 11px; color: #a0a0ff;"></span>
        <button id="membersToggle" class="members-toggle-btn" style="display: none;">👥</button>
        <button id="toggleChat" class="toggle-btn">−</button>
      </div>
      <div class="chat-content">
        <div class="online-members">
          <div class="members-header">Online Members</div>
          <div id="membersList" class="members-list"></div>
        </div>
        <div class="chat-main">
          <div id="messagesContainer" class="messages-container"></div>
          <div class="chat-input-container">
            <button id="emojiButton" class="emoji-button" title="Add emoji">😊</button>
            <input type="text" id="messageInput" class="message-input" placeholder="Type a message..." maxlength="200" />
            <button id="sendButton" class="send-button">Send</button>
          </div>
          <div id="emojiPicker" class="emoji-picker" style="display: none;"></div>
        </div>
      </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="/moonroom-config.js"></script>
    
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script
      async
      src="https://ga.jspm.io/npm:es-module-shims@1.6.3/dist/es-module-shims.js"
    ></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.168.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.168.0/examples/jsm/"
        }
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/libs/ammo.wasm.js"></script>

    <!-- Firebase and Chat Initialization -->
    <script>
      // Initialize Firebase with configuration from moonroom-config.js
      let database;
      try {
        firebase.initializeApp(MOONROOM_FIREBASE_CONFIG);
        database = firebase.database();
        window.database = database; // Make database globally available
        const auth = firebase.auth();
        
        console.log('Firebase initialized successfully');
        
        // Test connection to Firebase
        database.ref('.info/connected').on('value', function(snapshot) {
          if (snapshot.val() === true) {
            console.log('✅ Connected to Firebase Realtime Database');
          } else {
            console.warn('⚠️ Not connected to Firebase Realtime Database');
          }
        });
      } catch (error) {
        console.error('Firebase initialization error:', error);
      }

      // Chat functionality
      let currentUser = null;
      let userAddress = null;
      let userRanking = null;
      let userDisplayName = null;
      let userAvatarUrl = null;
      let messages = [];
      let onlineMembers = [];
      let chatMinimized = false;
      let lastMessageTimestamp = 0;

      // DOM elements
      let messageInput, sendButton, messagesContainer, membersList, chatContainer, toggleBtn, emojiButton, emojiPicker, membersToggle;

      // Initialize chat after DOM loads
      document.addEventListener('DOMContentLoaded', function() {
        messageInput = document.getElementById('messageInput');
        sendButton = document.getElementById('sendButton');
        messagesContainer = document.getElementById('messagesContainer');
        membersList = document.getElementById('membersList');
        chatContainer = document.getElementById('chatContainer');
        toggleBtn = document.getElementById('toggleChat');
        membersToggle = document.getElementById('membersToggle');
        emojiButton = document.getElementById('emojiButton');
        emojiPicker = document.getElementById('emojiPicker');

        // Prevent event propagation from chat interface
        if (chatContainer) {
          chatContainer.addEventListener('pointerdown', function(e) {
            e.stopPropagation();
          });
          chatContainer.addEventListener('pointermove', function(e) {
            e.stopPropagation();
          });
          chatContainer.addEventListener('pointerup', function(e) {
            e.stopPropagation();
          });
          chatContainer.addEventListener('click', function(e) {
            e.stopPropagation();
          });
        }

        // Check authentication and member status
        checkMemberAccess();

        // Set up event listeners
        sendButton.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          sendMessage();
        });
        
        messageInput.addEventListener('keypress', function(e) {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            e.stopPropagation();
            sendMessage();
          }
        });

        toggleBtn.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          toggleChat();
        });
        
        // Mobile members toggle
        if (membersToggle) {
          membersToggle.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            const membersList = document.querySelector('.online-members');
            membersList.classList.toggle('show');
            membersToggle.classList.toggle('active');
          });
        }

        // Initialize emoji picker
        initializeEmojiPicker();
        
        // Emoji button click handler
        emojiButton.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          toggleEmojiPicker();
        });

        // Close emoji picker when clicking outside
        document.addEventListener('click', function(e) {
          if (!emojiPicker.contains(e.target) && e.target !== emojiButton) {
            emojiPicker.style.display = 'none';
          }
        });
      });

      function checkMemberAccess() {
        // Add performance monitoring
        let frameCount = 0;
        let lastTime = performance.now();
        setInterval(() => {
          const now = performance.now();
          const fps = Math.round(frameCount * 1000 / (now - lastTime));
          frameCount = 0;
          lastTime = now;
          
          // Warn if FPS drops below 30
          if (fps < 30 && fps > 0) {
            console.warn(`Low FPS: ${fps}. Consider reducing activity.`);
          }
        }, 1000);
        
        // Track frame updates
        function countFrame() {
          frameCount++;
          requestAnimationFrame(countFrame);
        }
        countFrame();
        
        // Get user info from localStorage or session
        // First check if we have stored credentials
        userAddress = localStorage.getItem('walletAddress');
        userRanking = localStorage.getItem('memberRanking');
        userDisplayName = localStorage.getItem('userDisplayName');
        
        // Check if we have Clerk user data injected by the server
        if (window.CLERK_USER_DATA) {
          userAddress = window.CLERK_USER_DATA.userId;
          userRanking = window.CLERK_USER_DATA.illumin80Rank;
          userDisplayName = window.CLERK_USER_DATA.displayName;
          userAvatarUrl = window.CLERK_USER_DATA.avatarUrl;
        }

        // If not, check URL parameters (for when redirected from main app)
        const urlParams = new URLSearchParams(window.location.search);
        const urlAddress = urlParams.get('address');
        const urlRanking = urlParams.get('ranking');
        
        if (urlAddress && urlRanking) {
          userAddress = urlAddress;
          userRanking = urlRanking;
          localStorage.setItem('walletAddress', userAddress);
          localStorage.setItem('memberRanking', userRanking);
        }

        // Check if we're in an iframe and try to get data from parent
        if (window.parent !== window && !userAddress) {
          try {
            // Try to communicate with parent window
            window.parent.postMessage({ type: 'REQUEST_USER_INFO' }, '*');
            
            // Listen for response
            window.addEventListener('message', function(event) {
              if (event.data && event.data.type === 'USER_INFO') {
                userAddress = event.data.address;
                userRanking = event.data.ranking;
                localStorage.setItem('walletAddress', userAddress);
                localStorage.setItem('memberRanking', userRanking);
                updateUserDisplay();
              }
            });
          } catch (e) {
            console.log('Could not communicate with parent window:', e);
          }
        }

        // If still no user, generate a test user
        if (!userAddress) {
          // Generate a test user for demo purposes
          userAddress = 'moon_' + Math.random().toString(36).substr(2, 9);
          userRanking = Math.floor(Math.random() * 80) + 1;
          localStorage.setItem('walletAddress', userAddress);
          localStorage.setItem('memberRanking', userRanking);
          
          console.log('Generated test user:', {
            address: userAddress,
            ranking: userRanking,
            nickname: userDisplayName || `ILLUMIN80 #${userRanking}`
          });
        }

        window.userAddress = userAddress; // Make userAddress globally available
        console.log('Current user:', {
          address: userAddress,
          ranking: userRanking
        });

        // Update the UI to show user info
        updateUserDisplay();

        // Initialize chat listeners
        initializeChatListeners();
        setUserOnline();
      }

      function updateUserDisplay() {
        const userInfoEl = document.getElementById('userInfo');
        if (userInfoEl) {
          if (userDisplayName) {
            userInfoEl.textContent = `${userDisplayName} (#${userRanking})`;
          } else if (userRanking) {
            userInfoEl.textContent = `ILLUMIN80 #${userRanking}`;
          }
        }
      }

      function initializeChatListeners() {
        console.log('Initializing chat listeners...');
        
        if (!database) {
          console.error('Database not initialized, cannot set up listeners');
          return;
        }

        // Listen for new messages
        try {
          const chatRef = database.ref('moonRoom/chat');
          console.log('Setting up chat listener...');
          
          chatRef.orderByChild('timestamp').limitToLast(50).on('value', (snapshot) => {
            const data = snapshot.val();
            console.log('Chat data received, message count:', data ? Object.keys(data).length : 0);
            
            messages = [];
            let newestTimestamp = 0;
            let newestNonBotTimestamp = 0;
            if (data) {
              Object.keys(data).forEach(key => {
                const msg = { ...data[key], id: key };
                messages.push(msg);
                if (msg.timestamp > newestTimestamp) {
                  newestTimestamp = msg.timestamp;
                }
                // Track newest non-bot message timestamp
                if (!msg.isBot && msg.timestamp > newestNonBotTimestamp) {
                  newestNonBotTimestamp = msg.timestamp;
                }
              });
              messages.sort((a, b) => a.timestamp - b.timestamp);
              
              // Debug logging
              console.log('Message check - minimized:', chatMinimized, 'last timestamp:', lastMessageTimestamp, 'newest non-bot:', newestNonBotTimestamp);
              
              // Check for new non-bot messages while minimized
              if (chatMinimized && lastMessageTimestamp > 0 && newestNonBotTimestamp > lastMessageTimestamp) {
                console.log('🔔 NEW MESSAGE WHILE MINIMIZED (excluding bot messages)!');
                console.log('Adding new-message class to:', chatContainer);
                // Add visual notification
                chatContainer.classList.add('new-message');
                console.log('Classes after adding:', chatContainer.className);
                
                // Play notification sound
                try {
                  const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                  const oscillator = audioContext.createOscillator();
                  const gainNode = audioContext.createGain();
                  
                  oscillator.frequency.value = 800;
                  oscillator.type = 'sine';
                  gainNode.gain.value = 0.1;
                  
                  oscillator.connect(gainNode);
                  gainNode.connect(audioContext.destination);
                  
                  oscillator.start();
                  oscillator.stop(audioContext.currentTime + 0.15);
                } catch (e) {
                  console.log('Could not play notification sound:', e);
                }
              }
              
              // Update last timestamp after processing (track non-bot messages only)
              if (newestNonBotTimestamp > lastMessageTimestamp) {
                lastMessageTimestamp = newestNonBotTimestamp;
              }
            }
            
            displayMessages();
            
            // Check for new messages that need bot responses
            // Only process messages from the last 30 seconds to avoid responding to old messages
            if (data) {
              const thirtySecondsAgo = Date.now() - 30000;
              
              Object.keys(data).forEach(messageId => {
                const msg = data[messageId];
                
                // Log bot messages to see if they're being received
                if (msg.isBot) {
                  console.log('Bot message found:', msg.message.substring(0, 50));
                }
                
                // Skip if: bot message, already responded, too old, or from ourselves during init
                if (msg.isBot || 
                    respondedMessages.has(messageId) || 
                    msg.timestamp < thirtySecondsAgo ||
                    msg.replyTo) { // Skip messages that are already replies
                  return;
                }
                
                // Mark as responded immediately to prevent duplicates
                respondedMessages.add(messageId);
                console.log('New message detected:', msg.message, 'from:', msg.from);
                
                // Only the bot host responds to prevent duplicates
                database.ref('moonRoom/members').once('value', (membersSnapshot) => {
                  const members = Object.keys(membersSnapshot.val() || {});
                  const sortedMembers = members.sort();
                  const isBotHost = sortedMembers.length > 0 && sortedMembers[0] === userAddress;
                  
                  console.log('Bot host check:', { isBotHost, userAddress, firstMember: sortedMembers[0] });
                  
                  if (isBotHost && msg.message) {
                    console.log('Bot host will process message:', msg.message);
                    
                    // Get bot response
                    getMoonBotResponse(msg.message).then(botResponse => {
                      if (botResponse) {
                        console.log('Bot will respond with:', botResponse);
                        // Add delay for natural feel
                        setTimeout(() => {
                          console.log('Sending bot message now...');
                          sendBotMessage(botResponse, messageId);
                        }, 1500 + Math.random() * 1500);
                      } else {
                        console.log('No bot response generated for:', msg.message);
                      }
                    }).catch(error => {
                      console.error('Error getting bot response:', error);
                    });
                  } else if (!isBotHost) {
                    console.log('Not bot host, skipping response generation');
                  }
                });
              });
              
              // Clean up old responded messages to prevent memory leak
              if (respondedMessages.size > 100) {
                const messagesToKeep = Array.from(respondedMessages).slice(-50);
                respondedMessages.clear();
                messagesToKeep.forEach(id => respondedMessages.add(id));
              }
            }
          }, (error) => {
            console.error('Error listening to chat:', error);
          });

          // Listen for online members
          const membersRef = database.ref('moonRoom/members');
          console.log('Setting up members listener...');
          
          membersRef.on('value', (snapshot) => {
            console.log('Members data received:', snapshot.val());
            const previousMemberCount = onlineMembers.length;
            onlineMembers = [];
            const data = snapshot.val();
            
            if (data) {
              Object.values(data).forEach(member => {
                onlineMembers.push(member);
              });
              displayMembers();
              
              // Warn if too many users
              if (onlineMembers.length > 10) {
                console.warn(`High user count (${onlineMembers.length}). Performance may be affected.`);
                if (onlineMembers.length > 20) {
                  alert('Warning: Room has ' + onlineMembers.length + ' users. Performance may be severely impacted.');
                }
              }
            } else {
              // No members online - clear the member display
              displayMembers();
              
              // Clear chat messages when the last user leaves
              if (previousMemberCount > 0) {
                console.log('Last user left the room, clearing chat messages...');
                const chatRef = database.ref('moonRoom/chat');
                chatRef.remove().then(() => {
                  console.log('Chat messages cleared successfully');
                  messages = [];
                  if (messagesContainer) {
                    messagesContainer.innerHTML = '';
                  }
                }).catch(error => {
                  console.error('Error clearing chat messages:', error);
                });
              }
            }
          }, (error) => {

          });
        } catch (error) {
          console.error('Error setting up listeners:', error);
        }
      }

            database.ref('moonRoom/chat').orderByChild('timestamp').limitToLast(10).once('value', (snapshot) => {
              const recentMessages = snapshot.val() || {};
              const recentBotMessages = Object.values(recentMessages).filter(msg => 
                msg.isBot && (Date.now() - msg.timestamp < 10000) // Bot message in last 10 seconds
              );
              
              // Only send welcome if bot hasn't recently greeted
              if (recentBotMessages.length === 0) {
                sendBotMessage(`Welcome to the Moon Room, ${welcomeName}! 🌙 The moons await your command.`);
              }
            });
          }, 2000);

      // AI Bot functionality
      let lastBotMessageTime = 0;
      const botCooldown = 10000; // 10 seconds between bot messages
      const respondedMessages = new Set(); // Track which messages we've responded to
      
      function sendBotMessage(message, replyToId = null) {
        const now = Date.now();
        if (now - lastBotMessageTime < botCooldown) {
          console.log('Bot message blocked by cooldown');
          return; // Too soon for another bot message
        }
        lastBotMessageTime = now;
        
        const chatRef = database.ref('moonRoom/chat');
        const botMessage = {
          from: '🌙 Moon Bot',
          message: message,
          timestamp: firebase.database.ServerValue.TIMESTAMP,
          address: 'moon_bot',
          isBot: true,
          replyTo: replyToId // Track what message we're replying to
        };
        
        console.log('Pushing bot message to Firebase:', botMessage);
        chatRef.push(botMessage).then(() => {
          console.log('Bot message sent successfully');
        }).catch(error => {
          console.error('Error sending bot message:', error);
        });
      }
      
      // Enhanced AI responses with OpenAI fallback
      async function getMoonBotResponse(message) {
        try {
          // Try to use OpenAI API first
          const context = messages.slice(-5).filter(msg => !msg.isBot || msg.from === '🌙 Moon Bot');
          
          // Use the full URL - check if we're on localhost or production
          const apiUrl = window.location.hostname === 'localhost' 
            ? 'http://localhost:3000/api/moonbot'
            : `${window.location.origin}/api/moonbot`;
          
          console.log('Calling Moon Bot API at:', apiUrl);
          
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              message: message,
              context: context
            })
          });
          
          if (response.ok) {
            const data = await response.json();
            console.log('Moon Bot API response:', data);
            return data.response;
          } else {
            console.log('Moon Bot API error:', response.status, response.statusText);
          }
        } catch (error) {
          console.log('OpenAI API unavailable, using fallback responses:', error);
        }
        
        // Fallback to simple responses if API fails
        const lowerMsg = message.toLowerCase();
        
        // Greetings - but check if we already welcomed this user in this session
        if (lowerMsg.includes('hello') || lowerMsg.includes('hi') || lowerMsg.includes('hey')) {
          // If we already sent the automatic welcome in this session, give a different response
          if (window.moonBotGreeted) {

          const greetings = [

            "Greetings, lunar initiate. The moons have been expecting you ✨",

        }

          return "Your appreciation resonates through the lunar frequencies... The moons pulse with approval 💫";
        }
        
        // Random responses for other messages (20% chance)
        if (Math.random() < 0.2) {

          return randomResponses[Math.floor(Math.random() * randomResponses.length)];

      function sendMessage() {
        console.log('sendMessage called');
        
        if (!messageInput) {
          console.error('messageInput not found');
          return;
        }
        
        const messageText = messageInput.value.trim();
        console.log('Message text:', messageText);
        
        if (!messageText) {
          console.log('Empty message, not sending');
          return;
        }

        if (!database) {
          console.error('Database not initialized');
          alert('Chat is not connected. Please refresh the page.');
          return;
        }

        if (!userAddress || !userRanking) {
          console.error('User not initialized:', { userAddress, userRanking });
          return;

      function displayMessages() {
        messagesContainer.innerHTML = '';
        messages.forEach(msg => {
          const messageEl = document.createElement('div');
          messageEl.className = 'message';
          
          // Style bot messages differently
          if (msg.isBot) {
            messageEl.style.background = 'linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%)';
            messageEl.style.border = '1px solid rgba(102, 126, 234, 0.3)';
          }
          
          const authorEl = document.createElement('div');
          authorEl.className = 'message-author';
          authorEl.textContent = msg.from;
          if (msg.isBot) {
            authorEl.style.color = '#667eea';
          }
          
          const textEl = document.createElement('div');
          textEl.className = 'message-text';
          
          // Check if message is a sticker
          if (msg.message && msg.message.startsWith('[sticker:') && msg.message.endsWith(']')) {
            const stickerUrl = msg.message.slice(9, -1); // Extract URL from [sticker:url]
            textEl.innerHTML = `<img src="${stickerUrl}" alt="sticker" style="max-width: 150px; max-height: 150px; display: block; border-radius: 8px;">`;
          } else {
            textEl.textContent = msg.message;
          }

          timeEl.className = 'message-time';
          const time = new Date(msg.timestamp);
          timeEl.textContent = time.toLocaleTimeString();
          
          messageEl.appendChild(authorEl);
          messageEl.appendChild(textEl);
          messageEl.appendChild(timeEl);
          
          messagesContainer.appendChild(messageEl);
        });
        
        // Scroll to bottom
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

            avatarImg.className = 'member-avatar';
            avatarImg.src = member.avatarUrl;
            avatarImg.alt = member.nickname;

              // If image fails to load, replace with initials
              this.style.display = 'none';
              const defaultAvatar = document.createElement('div');

              defaultAvatar.textContent = member.nickname.charAt(0).toUpperCase();
              this.parentNode.insertBefore(defaultAvatar, this);

            memberEl.appendChild(avatarImg);

            defaultAvatar.className = 'member-avatar default';
            defaultAvatar.textContent = member.nickname.charAt(0).toUpperCase();
            memberEl.appendChild(defaultAvatar);

          const nameSpan = document.createElement('span');
          nameSpan.className = 'member-name';
          nameSpan.textContent = member.nickname;
          memberEl.appendChild(nameSpan);

            for (let i = 0; i < indices.length; i += 3) {
              const v1 = new Ammo.btVector3(

              );

          if (lastTime > 0) {
            const delta = (time - lastTime) / 1000;
            world.stepSimulation(delta, 10);
          }
          lastTime = time;

          for (let i = 0, il = meshes.length; i < il; i++) {
            const mesh = meshes[i];
            if (!mesh || (isDragging && mesh === selectedObject)) continue;

            // For multiplayer moons, only update from physics if we're the host
            // Non-hosts get their positions from Firebase updates
            if (mesh.name && mesh.name.startsWith('multiplayer_moon_')) {
              if (window.multiplayerProjectiles && !window.multiplayerProjectiles.isHost) {
                continue; // Non-hosts don't update from local physics
              }
              // Host continues to update normally from physics
            }

            if (mesh.isInstancedMesh) {
              const array = mesh.instanceMatrix.array;
              const bodies = meshMap.get(mesh);
              for (let j = 0; j < bodies.length; j++) {
                const body = bodies[j];
                if (!body) continue;

                body.getMotionState().getWorldTransform(worldTransform);
                const origin = worldTransform.getOrigin();
                const rotation = worldTransform.getRotation();
                computeQuaternionFromMatrix(origin, rotation, array, j * 16);
              }
              mesh.instanceMatrix.needsUpdate = true;
            } else if (mesh.isMesh) {
              const body = meshMap.get(mesh);
              if (!body) continue;

              body.getMotionState().getWorldTransform(worldTransform);
              const origin = worldTransform.getOrigin();
              const rotation = worldTransform.getRotation();
              mesh.position.set(origin.x(), origin.y(), origin.z());
              mesh.quaternion.set(
                rotation.x(),
                rotation.y(),
                rotation.z(),
                rotation.w()
              );
            }
          }
        }, 1000 / 60);

        return {
          addMesh: function (mesh, mass = 0) {
            const shape = createConvexHullShape(mesh.geometry);
            if (!shape) {
              console.error("AmmoPhysics: Shape is NULL.");
              return false;
            }
            addRigidBody(mesh, mass, shape);
          },

          addTerrainMesh: function (mesh, mass = 0) {
            const shape = createTerrainShape(mesh.geometry);
            if (!shape) {
              console.error("AmmoPhysics: Shape is NULL.");
              return false;
            }
            addRigidBody(mesh, mass, shape);
          },

          addShootingMesh: function (mesh, mass = 0, velocity = null) {
            if (!velocity) {
              console.error("AmmoPhysics: Parameter is NULL.");
              return false;
            }

            if (!mesh.name || (mesh.name && mesh.name !== shootingShapeName)) {
              shootingShapeSaved = createConvexHullShape(mesh.geometry);
              shootingShapeName = mesh.name;
            }

            if (!shootingShapeSaved) {
              console.error("AmmoPhysics: Shape is NULL.");
              return false;
            }

            addRigidBody(mesh, mass, shootingShapeSaved, velocity);
            
            // Add tracking for cleanup
            mesh.isProjectile = true;
          },
          
          removeBody: function(body) {
            if (body) {
              world.removeRigidBody(body);
            }
          },
        };
      }

      function computeQuaternionFromMatrix(e, t, n, o) {
        const i = t.x(),
          a = t.y(),
          r = t.z(),
          s = t.w(),
          l = i + i,
          c = a + a,
          d = r + r,
          h = i * l,
          m = i * c,
          w = i * d,
          E = a * c,
          u = a * d,
          p = r * d,
          g = s * l,
          M = s * c,
          y = s * d;
        (n[o + 0] = 1 - (E + p)),
          (n[o + 1] = m + y),
          (n[o + 2] = w - M),
          (n[o + 3] = 0),
          (n[o + 4] = m - y),
          (n[o + 5] = 1 - (h + p)),
          (n[o + 6] = u + g),
          (n[o + 7] = 0),
          (n[o + 8] = w + M),
          (n[o + 9] = u - g),
          (n[o + 10] = 1 - (h + E)),
          (n[o + 11] = 0),
          (n[o + 12] = e.x()),
          (n[o + 13] = e.y()),
          (n[o + 14] = e.z()),
          (n[o + 15] = 1);
      }

      // Main initialization
      (async function init() {
        let physics = await AmmoPhysics();
        let camera, scene, renderer, controls;
        let sphereGeom, sphereMat, light, chair;
        let intensity = 40;
        let color = 0x1a1a3a;
        const HEIGHT = 5;
        const BOUND = 20;

        // Scene setup
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000033);

        // Renderer setup
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Camera setup
        camera = new THREE.PerspectiveCamera(
          50, // Increase FOV to make the room appear larger
          window.innerWidth / window.innerHeight,
          0.01,
          1000 // Increase far clipping plane
        );
        camera.position.set(0, 3, 50);
        camera.lookAt(0, 0, 0);

        // Controls setup
        controls = new OrbitControls(camera, renderer.domElement);
        controls.autoRotate = false;
        controls.autoRotateSpeed = 1;
        controls.enableDamping = true;
        controls.enablePan = false;
        controls.minDistance = 3;
        controls.maxDistance = BOUND;
        controls.minPolarAngle = 0;
        controls.maxPolarAngle = (Math.PI / 2) * 0.9;
        controls.target.set(0, HEIGHT, 0);
        controls.update();

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        // Load textures and models
        const textureLoader = new THREE.TextureLoader();
        // const cubeLoader = new THREE.CubeTextureLoader();

        // // Set up environment maps
        // cubeLoader.setCrossOrigin("");
        // cubeLoader.setPath("https://threejs.org/examples/textures/cube/pisa/");

        Promise.all([
          new Promise((resolve) => {
            textureLoader.load(
              "https://happy358.github.io/Images/textures/lunar_color.jpg",
              resolve
            );
          }),
          new Promise((resolve) => {
            new GLTFLoader().load("/models/tvs.glb", resolve);
          }),
        ]).then(([moonTexture, chairModel]) => {
          // Create moon lamps
          moonTexture.anisotropy = 16;

          // Create the first lamp
          sphereGeom = new THREE.SphereGeometry(2, 30, 30);
          sphereMat = new THREE.MeshBasicMaterial({ color: color });
          sphereMat.color.multiplyScalar(3);

          let moonLamp = new THREE.Mesh(sphereGeom, sphereMat);
          moonLamp.position.set(0, 1, 0);
          moonLamp.name = "pointLight";

          // Add point light
          light = new THREE.PointLight(color, intensity, 10);
          light.castShadow = true;
          light.shadow.bias = -0.01;
          moonLamp.add(light);

          // Add glow effects
          let glowMesh1 = new THREE.Mesh(
            sphereGeom,
            new THREE.MeshLambertMaterial({
              color: "white",
              transparent: true,
              opacity: 0.3,
            })
          );
          glowMesh1.scale.set;
          glowMesh1.scale.set(1.02, 1.02, 1.02);
          moonLamp.add(glowMesh1);

          let glowMesh2 = new THREE.Mesh(
            sphereGeom,
            new THREE.MeshBasicMaterial({
              color: "white",
              transparent: true,
              opacity: 0.05,
            })
          );
          glowMesh2.scale.set(1.05, 1.05, 1.05);
          moonLamp.add(glowMesh2);

          // Create additional moon lamps (reduced to 3 to avoid conflict with multiplayer moons)
          // COMMENTED OUT: Local moon spawning
          /*
          for (let i = 0; i < 3; i++) {
            let newLamp = moonLamp.clone();
            color = new THREE.Color("#faf0e6");
            sphereMat = new THREE.MeshPhongMaterial({
              color: color,
              map: moonTexture,
              lightMap: moonTexture,
              lightMapIntensity: 3,
            });
            newLamp.material = sphereMat;
            newLamp.children[0].color.set(color);

            if (i === 0) {
              newLamp.position.set(0, 2 * HEIGHT, 0);
            } else {
              newLamp.position.set(
                THREE.MathUtils.randInt(-2 * HEIGHT, 2 * HEIGHT),
                THREE.MathUtils.randFloat(1.5 * HEIGHT, 4.0 * HEIGHT),
                THREE.MathUtils.randInt(-2 * HEIGHT, 1.3 * HEIGHT)
              );
              newLamp.rotation.set(
                THREE.MathUtils.randFloat(-2 * Math.PI, 2 * Math.PI),
                THREE.MathUtils.randFloat(-2 * Math.PI, 2 * Math.PI),
                THREE.MathUtils.randFloat(-2 * Math.PI, 2 * Math.PI)
              );
            }

            scene.add(newLamp);
            physics.addMesh(newLamp, 0.5);
            const body = meshMap.get(newLamp);
            if (body) {
              body.setDamping(0.5, 0.5);
              body.setFriction(0.2);
              body.setRestitution(0.7);
              body.setRollingFriction(0.1);
            }
          }
          */

          // Skip multiplayer for now - just create local moons
          // if (window.database && window.userAddress) {
          //   window.multiplayerProjectiles = new MultiplayerProjectiles(scene, window.database, physics);
          //   console.log('Multiplayer projectiles initialized');
          // }
          
          // Create local moons - EXACT copy from original
          for (let i = 0; i < 5; i++) {
            let newLamp = moonLamp.clone();
            let color = new THREE.Color("#faf0e6");
            let sphereMat = new THREE.MeshPhongMaterial({
              color: color,
              map: moonTexture,
              lightMap: moonTexture,
              lightMapIntensity: 3,
            });
            newLamp.material = sphereMat;
            newLamp.children[0].color.set(color);

            if (i === 0) {
              newLamp.position.set(0, 2 * HEIGHT, 0);
            } else {
              newLamp.position.set(
                THREE.MathUtils.randInt(-2 * HEIGHT, 2 * HEIGHT),
                THREE.MathUtils.randFloat(1.5 * HEIGHT, 4.0 * HEIGHT),
                THREE.MathUtils.randInt(-2 * HEIGHT, 1.3 * HEIGHT)
              );
              newLamp.rotation.set(
                THREE.MathUtils.randFloat(-2 * Math.PI, 2 * Math.PI),
                THREE.MathUtils.randFloat(-2 * Math.PI, 2 * Math.PI),
                THREE.MathUtils.randFloat(-2 * Math.PI, 2 * Math.PI)
              );
            }

            scene.add(newLamp);
            physics.addMesh(newLamp, 0.5);
            const body = meshMap.get(newLamp);
            if (body) {
              body.setDamping(0.5, 0.5);
              body.setFriction(0.2);
              body.setRestitution(0.7);
              body.setRollingFriction(0.1);
            }
          }

          // Create shooting balls
          const ballGeometry = new THREE.IcosahedronGeometry(0.8, 1);
          const ballMaterial = new THREE.MeshPhongMaterial({
            flatShading: true,
          });
          const shootBall = new THREE.Mesh(ballGeometry, ballMaterial);
          shootBall.castShadow = true;
          shootBall.name = "shootingBall";

          // Shoot ball on click
          // const raycaster = new THREE.Raycaster();

          const shootingForce = 35;
          const ballMass = 10;
          let lastShotTime = 0;
          const shotCooldown = 250; // Minimum 250ms between shots
          
          window.addEventListener("pointerdown", (event) => {
            // Check if the click is on the chat interface
            const chatContainer = document.getElementById('chatContainer');
            if (chatContainer && chatContainer.contains(event.target)) {
              // Don't shoot if clicking on chat
              return;
            }
            
            mouse.set(
              (event.clientX / window.innerWidth) * 2 - 1,
              -(event.clientY / window.innerHeight) * 2 + 1
            );

            camera.updateMatrixWorld();
            raycaster.setFromCamera(mouse, camera);

            // Hold Shift to grab, normal click to shoot
            if (event.shiftKey) {
              // Shift + click for grabbing
              const intersects = raycaster.intersectObjects(
                scene.children,
                true
              );

              for (let i = 0; i < intersects.length; i++) {
                let object = intersects[i].object;
                while (object.parent && object.parent !== scene) {
                  object = object.parent;
                }

                if (object.name === "pointLight" || (object.name && object.name.startsWith('multiplayer_moon_'))) {
                  isDragging = true;
                  selectedObject = object;
                  dragStartPosition.copy(selectedObject.position);

                  dragPlane.normal.copy(
                    camera.getWorldDirection(dragPlane.normal)
                  );
                  dragPlane.constant = -selectedObject.position.dot(
                    dragPlane.normal
                  );

                  previousMousePosition.set(event.clientX, event.clientY);
                  controls.enabled = false;
                  return;
                }
              }
            } else {
              // Normal click - shoot a ball (with rate limiting)
              const now = Date.now();
              if (now - lastShotTime < shotCooldown) {
                return; // Too soon since last shot
              }
              lastShotTime = now;
              
              let shootingDirection = new THREE.Vector3();
              shootingDirection.copy(raycaster.ray.direction);
              shootingDirection.add(raycaster.ray.origin);
              
              // Send projectile event to other players
              if (window.multiplayerProjectiles) {
                window.multiplayerProjectiles.sendProjectile(
                  shootingDirection, 
                  raycaster.ray.direction,
                  shootingForce
                );
              }

                let ball = shootBall.clone();
                ball.position.set(
                  shootingDirection.x,
                  shootingDirection.y,
                  shootingDirection.z
                );
                ball.material = ball.material.clone();

                let ballColor = new THREE.Color();
                ballColor.setHSL(
                  Math.abs(THREE.MathUtils.randInt(-1000, 1000) / 1000),
                  1,
                  THREE.MathUtils.randInt(500, 700) / 1000
                );
                ball.material.color.set(ballColor);

                scene.add(ball);

                shootingDirection.copy(raycaster.ray.direction);
                shootingDirection.multiplyScalar(shootingForce);
                physics.addShootingMesh(ball, ballMass, shootingDirection);
                
                // Remove the ball after 5 seconds (reduced for performance)
                setTimeout(() => {
                  if (ball.parent) {
                    scene.remove(ball);
                    ball.geometry.dispose();
                    ball.material.dispose();
                    // Remove from physics
                    const body = meshMap.get(ball);
                    if (body && physics.removeBody) {
                      physics.removeBody(body);
                    }
                    meshMap.delete(ball);
                  }
                }, 5000);
            }
          });

          // Modify the pointermove event to include collision detection
          window.addEventListener("pointermove", (event) => {
            // Check if mouse is over chat interface
            const chatContainer = document.getElementById('chatContainer');
            if (chatContainer && chatContainer.contains(event.target)) {
              return;
            }
            
            if (isDragging && selectedObject) {
              mousePosition.set(
                (event.clientX / window.innerWidth) * 2 - 1,
                -(event.clientY / window.innerHeight) * 2 + 1
              );

              raycaster.setFromCamera(mousePosition, camera);

              // Create a plane that follows the camera view
              dragPlane.normal.copy(camera.getWorldDirection(dragPlane.normal));
              const cameraDistance = camera.position.distanceTo(
                selectedObject.position
              );
              dragPlane.constant =
                -selectedObject.position.dot(dragPlane.normal) +
                cameraDistance * 0.5;

              if (raycaster.ray.intersectPlane(dragPlane, intersection)) {
                const body = meshMap.get(selectedObject);
                if (body) {
                  // Add some smoothing to the movement
                  const smoothFactor = 0.3;
                  const targetPosition = new THREE.Vector3(
                    intersection.x,
                    intersection.y,
                    intersection.z
                  );

                  // Constrain movement
                  const maxHeight = BOUND * 2;
                  const minHeight = 2;
                  targetPosition.y = Math.max(
                    minHeight,
                    Math.min(maxHeight, targetPosition.y)
                  );

                  // Keep within room bounds
                  const distanceFromCenter = new THREE.Vector2(
                    targetPosition.x,
                    targetPosition.z
                  ).length();
                  if (distanceFromCenter > BOUND * 0.8) {
                    const angle = Math.atan2(
                      targetPosition.z,
                      targetPosition.x
                    );
                    targetPosition.x = Math.cos(angle) * BOUND * 0.8;
                    targetPosition.z = Math.sin(angle) * BOUND * 0.8;
                  }

                  // Update physics body
                  let transform = new Ammo.btTransform();
                  body.getMotionState().getWorldTransform(transform);

                  // Smooth movement
                  const currentPos = new THREE.Vector3(
                    transform.getOrigin().x(),
                    transform.getOrigin().y(),
                    transform.getOrigin().z()
                  );

                  const smoothedPosition = new THREE.Vector3(
                    currentPos.x +
                      (targetPosition.x - currentPos.x) * smoothFactor,
                    currentPos.y +
                      (targetPosition.y - currentPos.y) * smoothFactor,
                    currentPos.z +
                      (targetPosition.z - currentPos.z) * smoothFactor
                  );

                  transform.setOrigin(
                    new Ammo.btVector3(
                      smoothedPosition.x,
                      smoothedPosition.y,
                      smoothedPosition.z
                    )
                  );

                  body.getMotionState().setWorldTransform(transform);
                  body.setLinearVelocity(new Ammo.btVector3(0, 0, 0));
                  body.setAngularVelocity(new Ammo.btVector3(0, 0, 0));
                  body.activate(true);

                  // Update visual position
                  selectedObject.position.copy(smoothedPosition);
                }
              }
            }
          });

          // Add this to enable right-click dragging without showing context menu
          window.addEventListener("contextmenu", (e) => e.preventDefault());

          window.addEventListener("pointerup", (event) => {
            // Check if releasing over chat interface
            const chatContainer = document.getElementById('chatContainer');
            if (chatContainer && chatContainer.contains(event.target)) {
              isDragging = false;
              selectedObject = null;
              controls.enabled = true;
              return;
            }
            
            if (isDragging && selectedObject) {
              const body = meshMap.get(selectedObject);
              if (body) {
                const deltaX = event.clientX - previousMousePosition.x;
                const deltaY = event.clientY - previousMousePosition.y;
                const throwForce = 0.7; // Increased throw force
                const upwardBias = 5; // Add upward force to throws

                // Calculate throw direction in world space
                const throwDirection = new THREE.Vector3(
                  deltaX * throwForce,
                  -deltaY * throwForce + upwardBias,
                  0
                ).applyQuaternion(camera.quaternion);

                // Apply velocity-based throwing
                const velocity = throwDirection.multiplyScalar(0.1); // Scale down for better control
                body.setLinearVelocity(
                  new Ammo.btVector3(velocity.x, velocity.y, velocity.z)
                );
                body.activate(true);
              }
            }

            isDragging = false;
            selectedObject = null;
            controls.enabled = true;
          });

          // Create environment
          // Wall
          const wallGeometry = new THREE.CylinderGeometry(
            BOUND,
            BOUND,
            4 * BOUND,
            32,
            1,
            false
          );
          const wallMaterial = new THREE.MeshPhongMaterial({
            color: 0x000033,
            shininess: 10,
            specular: 0x111111,
            side: THREE.DoubleSide,
          });
          const wall = new THREE.Mesh(wallGeometry, wallMaterial);
          wall.receiveShadow = true;
          wall.name = "wall";
          scene.add(wall);
          physics.addTerrainMesh(wall, 0);

          // Floor
          const floorGeometry = new THREE.CircleGeometry(1.5 * BOUND, 8);
          floorGeometry.rotateX(-Math.PI / 2);
          const floor = new THREE.Mesh(floorGeometry, wallMaterial);
          floor.receiveShadow = true;
          floor.name = "floor";
          scene.add(floor);
          physics.addTerrainMesh(floor, 0);

          // Add GLB model - use the entire scene
          chair = chairModel.scene;
          chair.scale.set(10, 10, 10);
          chair.position.set(0, 0, 0);
          // chair.rotation.y = Math.PI;
          
          // Set shadows for all meshes in the model
          chair.traverse((child) => {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
            }
          });
          
          chair.name = "chair";
          scene.add(chair);
          
          // Find the Empty mesh that contains the animated object
          let emptyMesh = null;
          chair.traverse((child) => {
            if (child.name === 'Empty') {
              emptyMesh = child;
              console.log("Found Empty mesh:", child);
            }
          });
          
          // Set up animation if the model has animations
          let mixer = null;
          if (chairModel.animations && chairModel.animations.length > 0) {
            // Create mixer for the entire scene (animations might target specific objects)
            mixer = new THREE.AnimationMixer(chair);
            
            // Log available animations and what they target
            console.log("Available animations:");
            chairModel.animations.forEach((clip, index) => {
              console.log(`${index}: ${clip.name}`);
              // Log what objects the animation targets
              if (clip.tracks && clip.tracks.length > 0) {
                const targetObjects = new Set(clip.tracks.map(track => track.name.split('.')[0]));
                console.log(`  Targets: ${Array.from(targetObjects).join(', ')}`);
              }
            });
            
            // Find and play the 'closed' animation specifically
            const closedAnimation = chairModel.animations.find(clip => 
              clip.name === 'closed'
            );
            
            if (closedAnimation) {
              const action = mixer.clipAction(closedAnimation);
              action.setLoop(THREE.LoopOnce); // Play once
              action.clampWhenFinished = true; // Stay at the last frame
              action.play();
              console.log(`Playing animation: ${closedAnimation.name}`);
            } else {
              // Fallback to close_action if 'closed' not found
              const closeAction = chairModel.animations.find(clip => 
                clip.name === 'close_action'
              );
              if (closeAction) {
                const action = mixer.clipAction(closeAction);
                action.setLoop(THREE.LoopOnce);
                action.clampWhenFinished = true;
                action.play();
                console.log(`Playing animation: ${closeAction.name}`);
              }
            }
            
            // If we found the Empty mesh, we can control it directly if needed
            if (emptyMesh) {
              console.log("Empty mesh ready for additional control if needed");
            }
          }
          
          // Create collision for the model (excluding animated parts)
          const geometries = [];
          chair.traverse((child) => {
            if (child.isMesh && child.geometry) {
              // Skip animated/skinned meshes
              const isAnimated = child.isSkinnedMesh || 
                               child.geometry.attributes.skinIndex || 
                               child.geometry.attributes.skinWeight;
              
              if (!isAnimated) {
                // Clone geometry for static meshes only
                const clonedGeometry = child.geometry.clone();
                
                // Remove any animation attributes that might have been left
                delete clonedGeometry.attributes.skinIndex;
                delete clonedGeometry.attributes.skinWeight;
                
                clonedGeometry.applyMatrix4(child.matrixWorld);
                geometries.push(clonedGeometry);
              }
            }
          });
          
          // Create collision hull from static geometries only
          if (geometries.length > 0) {
            try {
              const mergedGeometry = BufferGeometryUtils.mergeGeometries(geometries);
              
              // Create a simplified convex hull mesh for collision
              const hullMesh = new THREE.Mesh(
                mergedGeometry,
                new THREE.MeshBasicMaterial({
                  visible: false,  // Set to false to hide
                  wireframe: true,
                  color: 0x00ff00,
                  opacity: 0.3,
                  transparent: true
                })
              );
              hullMesh.scale.copy(chair.scale);
              hullMesh.position.copy(chair.position);
              hullMesh.name = "model_hull_collision";
              
              scene.add(hullMesh);
              physics.addMesh(hullMesh, 0); // Mass 0 = static
              
              console.log("Added convex hull collision for static parts");
            } catch (err) {
              console.warn("Could not merge geometries, using bounding box:", err);
              
              // Fallback to simple box collision
              const box = new THREE.Box3().setFromObject(chair);
              const size = new THREE.Vector3();
              const center = new THREE.Vector3();
              box.getSize(size);
              box.getCenter(center);
              
              const boxGeo = new THREE.BoxGeometry(size.x, size.y, size.z);
              const boxMesh = new THREE.Mesh(boxGeo, new THREE.MeshBasicMaterial({ visible: false }));
              boxMesh.position.copy(center);
              
              scene.add(boxMesh);
              physics.addMesh(boxMesh, 0);
            }
          }

          // document.getElementById("loading").style.display = "none";

          // Animation loop
          const clock = new THREE.Clock();
          function animate() {
            requestAnimationFrame(animate);
            
            // Update animation mixer if it exists
            if (mixer) {
              const delta = clock.getDelta();
              mixer.update(delta);
            }
            
            controls.update();
            renderer.render(scene, camera);
          }
          animate();

          window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
          });
        });
      })();
    </script>
